<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Contabilidad JFK · Análisis de gastos</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){var p=localStorage.getItem('jfk-theme-pref')||'auto';if(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
:root{--ink-900:#0E1016;--ink-800:#1A1D22;--ink-500:#6E7178;--ink-400:#98999B;
--punch:#009FE3;--punch-hover:#0085C0;--electric:#009FE3;--green:#1FA971;--amber:#E8A317;--red:#E5484D;
--font-sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--font-mono:'Space Grotesk',ui-monospace,Menlo,monospace;
--bg:#EEF1F5;--bg-elevated:#FFFFFF;--bg-sunken:#F3F5F8;--text:var(--ink-900);--text-muted:var(--ink-500);--border:#DFE3E9;--border-soft:#EAEDF1;
--cta:var(--punch);--shadow-soft:0 1px 2px rgba(14,16,22,.04),0 8px 24px rgba(14,16,22,.05);--navy:#0B1F3A;}
[data-theme="dark"]{--bg:var(--ink-900);--bg-elevated:var(--ink-800);--bg-sunken:#07080B;--text:#F4F5F7;--text-muted:var(--ink-400);--border:var(--ink-800);--border-soft:#232730;--shadow-soft:0 10px 30px rgba(0,0,0,.4);}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px calc(60px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.topbar .inner{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:2px}.logo img{height:22px}.logo .reg{color:var(--electric);font-size:9px;font-weight:700;margin-top:1px}
.logo small{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--electric);margin-left:10px}
.spacer{flex:1}.btn{font-weight:600;font-size:.82rem;border:none;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff}.btn-cta{background:var(--cta);color:#fff}.btn-sm{padding:6px 10px;font-size:.74rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:14px;padding:15px;box-shadow:var(--shadow-soft)}
.kpi .lbl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:800}.kpi .val{font-size:1.45rem;font-weight:800;margin-top:5px}
.kpi.accent{background:linear-gradient(135deg,var(--red),#b3373b);color:#fff;border:none}.kpi.accent .lbl{color:rgba(255,255,255,.85)}
.kpi .sub{font-size:.72rem;color:var(--text-muted);margin-top:3px}.up{color:var(--red);font-weight:700}.down{color:var(--green);font-weight:700}
.card{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:14px;padding:18px;box-shadow:var(--shadow-soft);margin-top:16px}
.card h2{font-size:1rem;margin:0 0 2px;font-weight:800}.h-sub{font-size:.76rem;color:var(--text-muted);margin-bottom:12px}
.bars{display:flex;align-items:stretch;gap:10px;height:150px;margin-top:10px}
.bw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bar{width:100%;max-width:60px;min-height:3px;background:var(--cta);border-radius:6px 6px 0 0}
.blbl{font-size:.66rem;color:var(--text-muted)}.bval{font-size:.66rem;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft)}
.track{flex:1;height:9px;background:var(--bg-sunken);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--cta);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{padding:9px;text-align:right;border-bottom:1px solid var(--border-soft);white-space:nowrap}th:first-child,td:first-child,.l{text-align:left}
th{font-size:.66rem;text-transform:uppercase;color:var(--text-muted);font-weight:800}
.loading{padding:40px;text-align:center;color:var(--text-muted)}
.gate{max-width:440px;margin:90px auto;text-align:center;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:16px;padding:34px}
.empty{background:var(--bg-sunken);border:1px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--text-muted);margin-top:16px}
@media(max-width:600px){.logo small{display:none}}
</style></head>
<body>
<div class="topbar"><div class="inner">
  <div class="logo"><img src="jfk-logo.png" alt="JFK"><sup class="reg">&reg;</sup><small>Análisis de gastos</small></div>
  <span class="spacer"></span>
  <button class="btn btn-ghost btn-sm" onclick="toggleTheme()">◐</button>
  <button class="btn btn-ghost btn-sm" onclick="location.href='contabilidad.html'">🧮 Contabilidad</button>
  <button class="btn btn-cta btn-sm" id="btnSync" onclick="sincronizar()">🔄 Actualizar desde SAP</button>
</div></div>
<div id="app" class="wrap" style="display:none"><div id="content"><div class="loading">Cargando…</div></div></div>
<div id="gate" class="gate" style="display:none"><h2 style="margin-top:0">Acceso restringido</h2><p style="color:var(--text-muted)">Entra primero a Contabilidad JFK.</p><a class="btn btn-sm btn-cta" href="contabilidad.html">Ir a Contabilidad JFK →</a></div>
<script>
const SESSION_KEY='jfk_vendor_session';
let sesion=null;try{sesion=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',c);localStorage.setItem('jfk-theme-pref',c);}
const EMAIL=(sesion&&sesion.email||'').trim().toLowerCase();
const ES_ADMIN=!!(sesion&&sesion.role==='admin');
const fmt=(n)=>'$'+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
const esc=(s)=>(''+(s==null?'':s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
if(!ES_ADMIN){document.getElementById('gate').style.display='block';}
else{document.getElementById('app').style.display='block';cargar();}
async function cargar(){
  document.getElementById('content').innerHTML='<div class="loading">Cargando análisis…</div>';
  try{
    const r=await fetch('/.netlify/functions/gastos-analisis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL})});
    const d=await r.json();
    if(!d.ok){document.getElementById('content').innerHTML='<div class="card">No se pudo cargar: '+esc(d.error||'error')+(/relation|does not exist/i.test(d.error||'')?'<br><br>Falta correr el SQL de <b>gastos_sap</b>.':'')+'</div>';return;}
    if(d.vacio){document.getElementById('content').innerHTML='<div class="empty">📊 Aún no hay gastos sincronizados.<br><br>Dale a <b>"🔄 Actualizar desde SAP"</b> (arriba) para traer tus gastos de SAP. Tarda 1-2 minutos.</div>';return;}
    render(d);
  }catch(e){document.getElementById('content').innerHTML='<div class="card">Error de conexión.</div>';}
}
function render(d){
  const cambio=d.total_anterior>0?Math.round((d.total_actual-d.total_anterior)/d.total_anterior*100):0;
  const maxAnio=Math.max(1,...d.por_anio.map(x=>x.total));
  const barsAnio=d.por_anio.map(x=>{const h=Math.round(x.total/maxAnio*100);return `<div class="bw" title="${x.anio}: ${fmt(x.total)}"><div class="bval">${fmt(x.total)}</div><div class="bar" style="height:${h}%"></div><div class="blbl">${x.anio}</div></div>`;}).join('');
  const maxCat=Math.max(1,...d.top_categorias.map(c=>c.actual));
  const cats=d.top_categorias.map(c=>`<div class="row"><div class="l" style="width:38%">${esc(c.nombre)}<div style="font-size:.7rem;color:var(--text-muted)">${esc(c.code)}</div></div><div class="track"><div class="fill" style="width:${Math.round(c.actual/maxCat*100)}%"></div></div><div class="num" style="width:90px;text-align:right;font-weight:700">${fmt(c.actual)}</div></div>`).join('');
  const subieron=d.subieron.length?d.subieron.map(c=>`<div class="row"><div class="l" style="flex:1">${esc(c.nombre)}</div><div class="num up" style="width:120px;text-align:right">+${fmt(c.delta)} <span style="font-size:.72rem">(+${c.pct}%)</span></div></div>`).join(''):'<div class="h-sub">Nada subió respecto al año pasado 👍</div>';
  const bajaron=d.bajaron.length?d.bajaron.map(c=>`<div class="row"><div class="l" style="flex:1">${esc(c.nombre)}</div><div class="num down" style="width:120px;text-align:right">${fmt(c.delta)} <span style="font-size:.72rem">(${c.pct}%)</span></div></div>`).join(''):'<div class="h-sub">—</div>';
  const provs=(d.top_proveedores||[]).map((p,i)=>`<tr><td class="l">${i+1}. ${esc(p.nombre)}</td><td class="num">${fmt(p.actual)}</td></tr>`).join('');
  document.getElementById('content').innerHTML=`
    <div class="kpis">
      <div class="kpi accent"><div class="lbl">Gastos ${d.anio_actual}</div><div class="val num">${fmt(d.total_actual)}</div><div class="sub" style="color:rgba(255,255,255,.85)">ene–hoy (mismo período)</div></div>
      <div class="kpi"><div class="lbl">Mismo período ${d.anio_actual-1}</div><div class="val num">${fmt(d.total_anterior)}</div><div class="sub">ene–misma fecha</div></div>
      <div class="kpi"><div class="lbl">Cambio vs mismo período</div><div class="val num ${cambio>0?'up':'down'}">${cambio>0?'+':''}${cambio}%</div><div class="sub">${cambio>0?'estás gastando más':'vas gastando menos'}</div></div>
      <div class="kpi"><div class="lbl">Categorías de gasto</div><div class="val num">${d.top_categorias.length}</div></div>
    </div>
    <div class="card"><h2>Gastos por año</h2><div class="h-sub">Total anual</div><div class="bars">${barsAnio}</div></div>
    <div class="card"><h2>⚠️ En qué estás gastando MÁS que antes</h2><div class="h-sub">Categorías que más subieron vs el mismo período de ${d.anio_actual-1} — candidatas a revisar/bajar</div>${subieron}</div>
    <div class="card"><h2>✅ Lo que bajó</h2><div class="h-sub">Categorías que gastaste menos que el año pasado</div>${bajaron}</div>
    <div class="card"><h2>Top categorías ${d.anio_actual}</h2><div class="h-sub">Dónde se va la plata este año</div>${cats}</div>
    ${provs?`<div class="card"><h2>Top proveedores ${d.anio_actual}</h2><table><thead><tr><th class="l">Proveedor</th><th>Gasto</th></tr></thead><tbody>${provs}</tbody></table></div>`:''}`;
}
async function sincronizar(){
  const b=document.getElementById('btnSync');b.disabled=true;const t=b.textContent;b.textContent='Sincronizando…';
  document.getElementById('content').innerHTML='<div class="loading">Trayendo gastos de SAP… esto tarda 1-2 minutos. Puedes esperar aquí.</div>';
  try{ await fetch('/.netlify/functions/gastos-sync-background',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL})}); }catch(e){}
  let intentos=0;
  const timer=setInterval(async()=>{
    intentos++;
    try{ const r=await fetch('/.netlify/functions/gastos-analisis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL})}); const d=await r.json();
      if(d.ok && !d.vacio){clearInterval(timer);b.disabled=false;b.textContent=t;render(d);}
      else if(intentos>=12){clearInterval(timer);b.disabled=false;b.textContent=t;cargar();}
    }catch(e){}
  },10000);
}
</script>
</body></html>
