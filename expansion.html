<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#16263d 0,transparent 60%),var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 90px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);position:relative}
.top::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:150px;background:linear-gradient(90deg,var(--accent),#ff7a45)}
.brand{font-family:var(--serif);font-size:28px;font-weight:700}.brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px}
.who{font-size:12px;color:var(--soft);text-align:right}.who b{color:var(--text)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:#04121f}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
.kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}.kpi .v{font-family:var(--serif);font-size:24px;font-weight:700;margin-top:5px}.kpi .s{font-size:11px;color:var(--soft)}
.tabs{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}.tabs .t{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}.tabs .t.on{background:var(--panel);color:var(--text);border-color:#33507a}
.panel{display:none}.panel.on{display:block;animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.sec-h{font-family:var(--serif);font-size:19px;margin:4px 0 12px}.muted{color:var(--muted)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font-size:13px}

.pc-card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.pc-card select,.pc-card input,.pc-card textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;font-size:11.5px;font-family:var(--sans)}

.edit.open{display:block}.edit input,.edit textarea{width:100%;margin-bottom:5px}
.empty{padding:50px;text-align:center;color:var(--muted)}

const EMPRESA="JFK", SESSION_KEY="jfk_vendor_session", API="/.netlify/functions/prospectos";
let SES=null; try{ SES=JSON.parse(localStorage.getItem(SESSION_KEY)||"null"); }catch(e){}
let ST={pros:[],esAdmin:false,paises:[],vends:[]}, fEstado="", fPais="", fQ="", fMine=false;
const fmt=n=>"$"+Math.round(n).toLocaleString("en-US");
const fmtK=n=> n>=1e6?"$"+(n/1e6).toFixed(2)+"M":n>=1e3?"$"+Math.round(n/1e3)+"k":"$"+Math.round(n);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200);}
async function api(action,extra){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({action,email:SES&&SES.email,nombre:SES&&SES.name},extra||{}))});return r.json();}

if(!SES||!SES.email){
  document.getElementById("app").innerHTML='<div class="empty">Inicia sesión en el portal para ver Expansión.<br><br><a href="vendedores.html">Ir al portal →</a></div>';
}else{ init(); }
document.getElementById("who").innerHTML = SES?`<b>${esc(SES.name||SES.email)}</b><br>${SES.role==="admin"?"Administrador":"Vendedor"}`:"";

async function init(){
  const r=await api("list");
  if(!r.ok){document.getElementById("app").innerHTML='<div class="empty">Error: '+esc(r.error||"")+'</div>';return;}
  ST.pros=r.prospectos||[]; ST.esAdmin=r.esAdmin; ST.paises=r.paisesAsignados||[];
  if(ST.esAdmin){ const v=await api("vendors"); ST.vends=(v.vendedores||[]); ST.paisVend=(v.paisVendedor||[]); }
  render();
}
const EST=["nuevo","asignado","contactando","contactado","cliente","descartado"];
const ESTL={nuevo:"Nuevo",asignado:"Asignado",contactando:"Contactando",contactado:"Contactado",cliente:"¡Cliente!",descartado:"Descartado"};

function render(){
  const oppP = OPP.paises.filter(p=> ST.esAdmin || ST.paises.includes(p.name));
  const proyTot=oppP.reduce((s,p)=>s+Math.max(0,p.proy),0);
  const mine=ST.pros.filter(p=>p.asignado_email&&SES&&p.asignado_email.toLowerCase()===SES.email.toLowerCase());
  const pend=mine.filter(p=>["asignado","contactando"].includes(p.estado)).length;
  const contactados=ST.pros.filter(p=>["contactado","cliente"].includes(p.estado)).length;
  const kpis=[
    ["Prospectos", ST.pros.length, ST.esAdmin?"en tu base":"a tu alcance"],
    ["Por contactar", pend, "asignados a ti"],
    ["Contactados", contactados, "incl. clientes"],
    ["Países", [...new Set(ST.pros.map(p=>p.pais))].length, ""],
    ["Proyección 12m", fmtK(proyTot), "oportunidad"]
  ];
  let html=`<div class="kpis">${kpis.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join("")}</div>
  <div class="tabs"><div class="t on" data-tab="pros">🎯 Clientes potenciales</div><div class="t" data-tab="opp">📈 Oportunidad por país</div></div>
  <div class="panel on" id="p-pros">${renderPros()}</div>
  <div class="panel" id="p-opp">${renderOpp(oppP)}</div>`;
  document.getElementById("app").innerHTML=html;
  bind();
}
function vendOptions(sel){return '<option value="">— vendedor —</option>'+ST.vends.map(v=>`<option value="${esc(v.email)}|${esc(v.name)}" ${sel&&sel.toLowerCase()===v.email.toLowerCase()?"selected":""}>${esc(v.name)}</option>`).join("");}

function renderPros(){
  let list=ST.pros.slice();
  if(fMine) list=list.filter(p=>p.asignado_email&&p.asignado_email.toLowerCase()===SES.email.toLowerCase());
  if(fEstado) list=list.filter(p=>p.estado===fEstado);
  if(fPais) list=list.filter(p=>p.pais===fPais);
  if(fQ){const q=fQ.toLowerCase();list=list.filter(p=>((p.empresa||"")+(p.ciudad||"")+(p.direccion||"")+(p.tipo||"")+(p.que_vende||"")+(p.pais||"")).toLowerCase().includes(q));}
  const paisesAll=[...new Set(ST.pros.map(p=>p.pais))].sort();
  const grupos={}; list.forEach(p=>{(grupos[p.pais]=grupos[p.pais]||[]).push(p);});
  const chips=['<span class="chip '+(fEstado===""?"on":"")+'" data-est="">Todos</span>']
    .concat(EST.map(e=>`<span class="chip ${fEstado===e?"on":""}" data-est="${e}">${ESTL[e]}</span>`)).join("");
  let h=`<div class="filters">
    <input id="q" placeholder="🔎 Buscar empresa, ciudad, dirección..." value="${esc(fQ)}">
    <select id="fpais"><option value="">Todos los países (${paisesAll.length})</option>${paisesAll.map(p=>`<option ${fPais===p?"selected":""}>${esc(p)}</option>`).join("")}</select>
    ${!ST.esAdmin?'':''}
    <span class="chip ${fMine?"on":""}" id="cmine">⭐ Asignados a mí</span>
    <button class="btn p" id="addBtn">+ Agregar</button>
  </div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${chips}</div>
  <div class="count">${list.length} prospecto(s)${fPais?" en "+esc(fPais):""}</div>`;
  const orderedPaises=Object.keys(grupos).sort();
  if(!orderedPaises.length) return h+'<div class="empty">Sin prospectos con estos filtros.</div>';
  h+=orderedPaises.map(pais=>{
    const items=grupos[pais];
    const asg=(ST.paisVend||[]).find(x=>x.pais===pais);
    const adminPais= ST.esAdmin?`<div class="assignpais" onclick="event.stopPropagation()">Encargado país: <select data-pais="${esc(pais)}" class="selpais">${vendOptions(asg&&asg.vendedor_email)}</select></div>`:"";
    return `<div class="paisgrp ${fPais||fQ||fEstado||fMine?"open":""}"><div class="paishd"><div><span class="arr">▶</span> <h3 style="display:inline">${esc(pais)}</h3> <span class="pc">${items.length}</span></div>${adminPais}</div>
      <div class="paisbody">${items.map(card).join("")}</div></div>`;
  }).join("");
  return h;
}
function card(p){
  const web=p.web?`<a class="lnk" href="${p.web.startsWith("http")?p.web:"https://"+p.web}" target="_blank">${esc(p.web.replace(/^https?:\/\//,"").slice(0,28))} ↗</a>`:"";
  const canEdit = ST.esAdmin || (p.asignado_email&&p.asignado_email.toLowerCase()===SES.email.toLowerCase()) || ST.paises.includes(p.pais);
  const estSel = canEdit?`<select class="selest" data-id="${p.id}">${EST.map(e=>`<option value="${e}" ${p.estado===e?"selected":""}>${ESTL[e]}</option>`).join("")}</select>`:`<span class="tag">${ESTL[p.estado]||p.estado}</span>`;
  const adminAsg = ST.esAdmin?`<select class="selasg" data-id="${p.id}">${vendOptions(p.asignado_email)}</select>`:"";
  return `<div class="pc-card">
    <span class="est e-${p.estado}">${ESTL[p.estado]||p.estado}</span>
    <h4>${esc(p.empresa)}</h4>
    <div class="loc">📍 ${esc(p.pais)}${p.ciudad?" · "+esc(p.ciudad):""}${p.direccion?"<br>"+esc(p.direccion):""}</div>
    <div class="desc">${esc(p.que_vende||"")}</div>
    <div class="row">${p.tipo?`<span class="tag">${esc(p.tipo)}</span>`:""}${web}${p.contacto?`<span class="mini">☎ ${esc(p.contacto)}</span>`:""}</div>
    ${p.asignado_nombre?`<div class="asg">⭐ Asignado a ${esc(p.asignado_nombre)}</div>`:""}
    <div class="row">${estSel}${adminAsg}${canEdit?`<button class="btn" style="padding:6px 10px" onclick="toggleEdit('${p.id}')">✎ datos</button>`:""}</div>
    ${canEdit?`<div class="edit" id="ed-${p.id}">
      <input id="c-${p.id}" placeholder="Contacto (tel/email)" value="${esc(p.contacto||"")}">
      <input id="ci-${p.id}" placeholder="Ciudad" value="${esc(p.ciudad||"")}">
      <input id="d-${p.id}" placeholder="Dirección" value="${esc(p.direccion||"")}">
      <textarea id="n-${p.id}" placeholder="Notas" rows="2">${esc(p.notas||"")}</textarea>
      <button class="btn p" style="padding:6px 12px" onclick="saveEdit('${p.id}')">Guardar</button>
    </div>`:(p.notas?`<div class="mini">${esc(p.notas)}</div>`:"")}
  </div>`;
}
function renderOpp(ps){
  const top=[...ps].filter(p=>p.proy>0).sort((a,b)=>b.proy-a.proy).slice(0,12);
  const mx=Math.max(...top.map(p=>p.proy),1);
  const bars=top.map(p=>{const w=Math.max(2,p.proy/mx*100);const g=p.growth>=0?`<span class="up">▲${p.growth}%</span>`:`<span class="dn">▼${Math.abs(p.growth)}%</span>`;return `<div class="bar"><div class="nm">${esc(p.name)}</div><div class="track"><div class="fill" data-w="${w}"></div></div><div class="val">${fmtK(p.proy)} ${g}</div></div>`;}).join("");
  const rows=[...ps].sort((a,b)=>b.l12-a.l12).map(p=>{const hv=p.l12>0;const g=!hv?'<span class="muted">—</span>':(p.growth>=0?`<span class="up">+${p.growth}%</span>`:`<span class="dn">${p.growth}%</span>`);const ch=p.blancos.length?`<div class="chips2">${p.blancos.map(b=>`<span class="c">${esc(b)}</span>`).join("")}</div>`:'<span class="muted">—</span>';return `<tr><td>${esc(p.name)}</td><td class="num">${hv?fmt(p.l12):"$0"}</td><td class="num">${g}</td><td class="num">${hv&&p.proy>0?fmt(p.proy):"—"}</td><td class="num">${p.cli}</td><td>${ch}</td></tr>`;}).join("");
  return `<div class="chart"><div class="sec-h">Top proyección a 12 meses</div>${bars}</div>
  <div class="tablewrap"><table><thead><tr><th>País</th><th class="num">Ventas 12m</th><th class="num">YoY</th><th class="num">Proyección</th><th class="num">Clientes</th><th>No vendes ahí</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="mini" style="margin-top:8px">Snapshot Junio 2026 · proyección al ritmo actual.</p>`;
}
function bind(){
  document.querySelectorAll(".tabs .t").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tabs .t").forEach(x=>x.classList.remove("on"));t.classList.add("on");document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));document.getElementById("p-"+t.dataset.tab).classList.add("on");setTimeout(()=>document.querySelectorAll("#p-opp .fill").forEach(f=>f.style.width=f.dataset.w+"%"),50);});
  document.querySelectorAll(".paishd").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  const q=document.getElementById("q");if(q)q.oninput=e=>{fQ=e.target.value;const s=e.target.selectionStart;render();const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(s,s);}};
  const fp=document.getElementById("fpais");if(fp)fp.onchange=e=>{fPais=e.target.value;render();};
  document.querySelectorAll(".chip[data-est]").forEach(c=>c.onclick=()=>{fEstado=c.dataset.est;render();});
  const cm=document.getElementById("cmine");if(cm)cm.onclick=()=>{fMine=!fMine;render();};
  const ab=document.getElementById("addBtn");if(ab)ab.onclick=openAdd;
  document.querySelectorAll(".selest").forEach(s=>s.onchange=async()=>{const r=await api("update",{id:s.dataset.id,fields:{estado:s.value}});if(r.ok){toast("Estado actualizado");const p=ST.pros.find(x=>x.id===s.dataset.id);if(p)p.estado=s.value;render();}else toast("Error");});
  document.querySelectorAll(".selasg").forEach(s=>s.onchange=async()=>{const[em,nm]=(s.value||"|").split("|");const r=await api("assign",{id:s.dataset.id,vendedor_email:em,vendedor_nombre:nm});if(r.ok){toast(em?("Asignado a "+nm+" (correo enviado)"):"Asignación quitada");init();}else toast("Error");});
  document.querySelectorAll(".selpais").forEach(s=>s.onchange=async()=>{const[em,nm]=(s.value||"|").split("|");const r=await api("assignPais",{pais:s.dataset.pais,vendedor_email:em,vendedor_nombre:nm});if(r.ok){toast("País asignado a "+(nm||"—"));init();}else toast("Error");});
}
function toggleEdit(id){document.getElementById("ed-"+id).classList.toggle("open");}
async function saveEdit(id){const f={contacto:val("c-"+id),ciudad:val("ci-"+id),direccion:val("d-"+id),notas:val("n-"+id)};const r=await api("update",{id,fields:f});if(r.ok){toast("Guardado");const p=ST.pros.find(x=>x.id===id);if(p)Object.assign(p,f);render();}else toast("Error: "+(r.error||""));}
function val(id){const e=document.getElementById(id);return e?e.value:undefined;}
function openAdd(){document.getElementById("m_pais").value=(!ST.esAdmin&&ST.paises[0])||fPais||"";document.getElementById("addModal").classList.add("on");}
function closeAdd(){document.getElementById("addModal").classList.remove("on");}
async function saveAdd(){const f={empresa:val("m_empresa"),pais:val("m_pais"),ciudad:val("m_ciudad"),direccion:val("m_dir"),tipo:val("m_tipo"),que_vende:val("m_vende"),web:val("m_web"),contacto:val("m_contacto"),notas:val("m_notas")};if(!f.empresa||!f.pais){toast("Empresa y país son obligatorios");return;}const r=await api("add",{fields:f});if(r.ok){toast("Prospecto agregado");closeAdd();init();}else toast("Error: "+(r.error||""));}
</script></body></html>
