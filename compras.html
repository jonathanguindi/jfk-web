<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JFK · Portal Compras</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
(function() {
  var pref = localStorage.getItem('jfk-theme-pref') || 'auto';
  var root = document.documentElement;
  root.setAttribute('data-theme-pref', pref);
  if (pref === 'light' || pref === 'dark') root.setAttribute('data-theme', pref);
  var isDark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', isDark ? '#0E1016' : '#FFFBF2');
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Azeret+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.0/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<style>
:root {
  --ink-900:#0E1016; --ink-800:#1A1D22; --ink-700:#34363B; --ink-600:#54565B;
  --ink-500:#6E7178; --ink-400:#98999B; --ink-300:#C4C6CA; --ink-200:#D4D6DA; --ink-100:#E5E7EA; --ink-50:#F4F5F7;
  --sun:#FFB627; --punch:#FF6B35; --punch-hover:#E55A28; --fire:#E94734; --berry:#C2185B;
  --electric:#009FE3; --ocean:#0069A7; --nebula:#5D5DA5; --midnight:#0E2244;
  --mint-50:#DCFAF8; --neon:#00D4D0; --jade:#00B0AD; --blue-50:#E1F0FF;
  --cream:#FFFBF2; --vanilla:#FFF4D6;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-serif:'Fraunces',Georgia,serif;
  --font-mono:'Azeret Mono',ui-monospace,SFMono-Regular,monospace;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --bg:var(--cream); --bg-elevated:#FFFFFF; --surface-1:#FFFFFF; --surface-2:var(--ink-50);
  --text:var(--ink-900); --text-strong:var(--ink-900); --text-muted:var(--ink-500); --text-subtle:var(--ink-400);
  --border:var(--ink-200); --border-soft:var(--ink-100);
  --accent:var(--electric); --success:var(--jade); --error:var(--fire);
  --cta:var(--punch); --cta-hover:var(--punch-hover); --cta-text:#FFFFFF;
  --header-bg:var(--ink-900); --header-text:var(--cream);
  --overlay:rgba(14,16,22,0.55); --shadow-soft:0 12px 34px rgba(14,16,22,0.10);
}
[data-theme="dark"] {
  --bg:var(--ink-900); --bg-elevated:var(--ink-800); --surface-1:var(--ink-800); --surface-2:var(--ink-700);
  --text:var(--cream); --text-strong:#FFFFFF; --text-muted:var(--ink-400); --text-subtle:var(--ink-500);
  --border:var(--ink-700); --border-soft:var(--ink-800);
  --accent:var(--electric); --success:var(--neon); --error:var(--punch);
  --header-bg:#07080B; --overlay:rgba(0,0,0,0.65); --shadow-soft:0 12px 34px rgba(0,0,0,0.45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:var(--ink-900); --bg-elevated:var(--ink-800); --surface-1:var(--ink-800); --surface-2:var(--ink-700);
    --text:var(--cream); --text-strong:#FFFFFF; --text-muted:var(--ink-400); --text-subtle:var(--ink-500);
    --border:var(--ink-700); --border-soft:var(--ink-800);
    --success:var(--neon); --error:var(--punch); --header-bg:#07080B; --overlay:rgba(0,0,0,0.65);
    --shadow-soft:0 12px 34px rgba(0,0,0,0.45);
  }
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
body { font-family:var(--font-sans); background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh; min-height:100dvh; overflow-x:hidden; }
.hidden { display:none !important; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input { font-family:inherit; }
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

/* ===== shared dark hero (login + home) ===== */
.dark-hero { position:relative; overflow:hidden; min-height:100dvh; background:var(--ink-900); color:var(--cream); }
.dark-hero::before { content:''; position:absolute; top:-25%; right:-35%; width:95%; height:170%; background:linear-gradient(135deg,var(--punch),var(--fire)); transform:rotate(-64deg); opacity:0.16; filter:blur(1px); pointer-events:none; }
.dark-hero::after { content:''; position:absolute; bottom:-30%; left:-30%; width:80%; height:140%; background:linear-gradient(135deg,var(--electric),var(--neon)); transform:rotate(-64deg); opacity:0.12; pointer-events:none; }
.angle-mark { width:54px; height:4px; background:var(--punch); margin:0.9rem auto 1.1rem; transform:skewX(-26deg); }

/* ===== LOGIN ===== */
#screen-login { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.25rem; }
.hero-wrap { position:relative; z-index:1; width:100%; max-width:360px; text-align:center; }
.brand-logo { font-family:var(--font-serif); font-weight:600; letter-spacing:-2px; line-height:1; }
.brand-logo sup { font-family:var(--font-sans); font-size:0.28em; font-weight:700; vertical-align:super; margin-left:2px; color:var(--punch); }
.login-logo { font-size:3.2rem; animation:fadeUp .5s .04s ease both; }
.tagline { font-family:var(--font-serif); font-style:italic; font-weight:500; font-size:1.2rem; color:var(--cream); }
.sub-mono { font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.22em; font-size:0.66rem; color:var(--sun); }
#screen-login .angle-mark { animation:fadeUp .5s .08s ease both; }
#screen-login .tagline { animation:fadeUp .5s .12s ease both; }
#screen-login .sub-mono { margin:0.45rem 0 2rem; animation:fadeUp .5s .16s ease both; }
.login-card { width:100%; background:rgba(26,29,34,0.85); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid var(--ink-700); border-radius:18px; padding:1.5rem; text-align:left; animation:fadeUp .5s .2s ease both; }
.login-card label { display:block; font-family:var(--font-mono); font-size:0.66rem; font-weight:600; color:var(--ink-400); margin:0 0 0.4rem; text-transform:uppercase; letter-spacing:0.12em; }
.login-card input { width:100%; padding:0.8rem 1rem; margin-bottom:1rem; border-radius:10px; border:1px solid var(--ink-700); background:var(--ink-900); color:var(--cream); font-size:1rem; }
.login-card input:focus { outline:none; border-color:var(--punch); }
.login-btn { width:100%; background:var(--cta); color:var(--cta-text); padding:0.9rem; border-radius:10px; font-weight:800; font-size:1rem; transition:background .15s; }
.login-btn:active { background:var(--cta-hover); }
.login-err { color:#FFB4A6; font-size:0.85rem; min-height:1.2em; margin-bottom:0.75rem; text-align:center; }

/* ===== HOME / INICIO ===== */
#screen-home { display:flex; flex-direction:column; }
.home-topbar { position:relative; z-index:2; display:flex; align-items:center; gap:0.55rem; padding:calc(0.7rem + var(--safe-top)) 1rem 0.4rem; }
.home-topbar .spacer { flex:1; }
.home-hero { position:relative; z-index:1; text-align:center; padding:1.6rem 1.25rem 0.5rem; }
.home-logo { font-size:3.8rem; animation:fadeUp .5s .02s ease both; }
.home-hero .tagline { animation:fadeUp .5s .1s ease both; }
.home-hero .sub-mono { margin-top:0.4rem; animation:fadeUp .5s .14s ease both; }
.home-greet { font-family:var(--font-mono); font-size:0.74rem; color:var(--ink-300); margin-top:1.1rem; letter-spacing:0.04em; animation:fadeUp .5s .18s ease both; }
.home-cards { position:relative; z-index:1; width:100%; max-width:480px; margin:1.3rem auto 0; padding:0 1.25rem 2rem; display:flex; flex-direction:column; gap:0.75rem; }
.home-card { display:flex; align-items:center; gap:1rem; padding:1.05rem 1.1rem; border-radius:16px; text-align:left; background:rgba(26,29,34,0.85); border:1px solid var(--ink-700); color:var(--cream); animation:fadeUp .5s .22s ease both; transition:transform .12s; }
.home-card:active { transform:scale(0.985); }
.home-card.primary { background:linear-gradient(135deg,var(--punch),var(--fire)); border:none; box-shadow:0 14px 30px rgba(255,107,53,0.3); }
.hc-icon { width:48px; height:48px; border-radius:13px; background:rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.hc-icon svg { width:24px; height:24px; stroke:currentColor; fill:none; }
.hc-text { flex:1; min-width:0; }
.hc-title { font-weight:800; font-size:1.06rem; }
.hc-desc { font-size:0.8rem; opacity:0.9; margin-top:1px; }
.hc-arrow { font-size:1.4rem; opacity:0.9; }
.home-stat { text-align:center; font-family:var(--font-mono); font-size:0.7rem; color:var(--ink-400); letter-spacing:0.04em; animation:fadeUp .5s .26s ease both; }

/* ===== APP HEADER ===== */
.app-header { position:sticky; top:0; z-index:30; background:var(--header-bg); color:var(--header-text); padding:calc(0.75rem + var(--safe-top)) 1rem 0.75rem; display:flex; align-items:center; gap:0.55rem; overflow:hidden; }
.app-header::after { content:''; position:absolute; top:-50%; right:-6%; width:120px; height:220%; background:var(--punch); opacity:0.18; transform:rotate(-64deg); pointer-events:none; }
.app-header .brand { position:relative; z-index:1; font-family:var(--font-serif); font-weight:600; font-size:1.4rem; letter-spacing:-0.5px; }
.app-header .brand sup { font-family:var(--font-sans); font-size:0.4em; font-weight:700; vertical-align:super; color:var(--punch); margin-left:1px; }
.app-header .tag { position:relative; z-index:1; font-family:var(--font-mono); font-size:0.6rem; font-weight:600; color:var(--sun); text-transform:uppercase; letter-spacing:0.18em; padding-top:0.3rem; }
.app-header .spacer { flex:1; }
.icon-btn { position:relative; z-index:1; width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; color:var(--cream); }
.icon-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; }

/* ===== SUPPLIER BAR ===== */
.supplier-bar { background:var(--bg-elevated); border-bottom:1px solid var(--border-soft); padding:0.85rem 1rem; display:flex; align-items:center; gap:0.75rem; }
.supplier-bar .info { flex:1; min-width:0; }
.supplier-bar .lbl { font-family:var(--font-mono); font-size:0.62rem; font-weight:600; color:var(--text-subtle); text-transform:uppercase; letter-spacing:0.14em; }
.supplier-bar .name { font-weight:700; font-size:1rem; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.supplier-bar .meta { font-family:var(--font-mono); font-size:0.7rem; color:var(--text-muted); }
.btn-pill { background:var(--cta); color:var(--cta-text); padding:0.55rem 1.05rem; border-radius:999px; font-weight:800; font-size:0.8rem; white-space:nowrap; transition:background .15s; }
.btn-pill:active { background:var(--cta-hover); }

/* ===== TABS ===== */
.tabbar { display:flex; background:var(--bg-elevated); border-bottom:1px solid var(--border-soft); }
.tabbar button { flex:1; padding:0.75rem; font-family:var(--font-mono); font-weight:600; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); border-bottom:2px solid transparent; transition:color .15s; }
.tabbar button.active { color:var(--punch); border-bottom-color:var(--punch); }

/* ===== SEARCH ===== */
.search-row { padding:0.7rem 1rem; background:var(--bg-elevated); border-bottom:1px solid var(--border-soft); }
.search-row input { width:100%; padding:0.6rem 1rem 0.6rem 2.3rem; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px; font-size:0.9rem; color:var(--text);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236E7178' stroke-width='2'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
  background-repeat:no-repeat; background-position:0.65rem center; background-size:15px; }
.search-row input:focus { outline:none; border-color:var(--punch); }

/* ===== LISTS ===== */
.list { padding:0.75rem 1rem 7.5rem; animation:fadeIn .3s ease; }
.empty { text-align:center; color:var(--text-muted); padding:3rem 1rem; font-size:0.9rem; }
.count-line { font-family:var(--font-mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-subtle); padding:0 0.1rem 0.6rem; }

/* product grid: 2 por fila en movil, mas en pantallas anchas */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:0.6rem; }
.card { position:relative; background:var(--surface-1); border:1px solid var(--border-soft); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .15s, box-shadow .15s; }
.card.has { border-color:var(--punch); box-shadow:0 0 0 1px var(--punch); }
.card-photo { position:relative; width:100%; aspect-ratio:1/1; background:var(--surface-2); display:flex; align-items:center; justify-content:center; }
.card-photo img { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; }
.card-photo .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-300); z-index:0; }
.card-photo .ph svg { width:34px; height:34px; stroke:currentColor; fill:none; }
.badge-cart { position:absolute; top:6px; right:6px; z-index:2; background:var(--punch); color:#fff; font-family:var(--font-mono); font-size:0.7rem; font-weight:700; min-width:22px; height:22px; padding:0 6px; border-radius:11px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.25); }
.card-body { padding:0.6rem 0.65rem 0.7rem; display:flex; flex-direction:column; flex:1; }
.card-body .pcode { font-family:var(--font-mono); font-size:0.63rem; font-weight:600; color:var(--electric); letter-spacing:0.01em; }
.card-body .pname { font-size:0.82rem; font-weight:600; color:var(--text-strong); line-height:1.2; margin-top:1px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:1.98em; }
.card-price { font-family:var(--font-mono); font-weight:800; font-size:1.02rem; color:var(--punch); margin-top:0.35rem; line-height:1.1; }
.card-price small { display:block; font-family:var(--font-mono); font-weight:600; font-size:0.58rem; color:var(--text-subtle); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:1px; }
.card-meta { font-family:var(--font-mono); font-size:0.64rem; color:var(--text-muted); margin-top:0.4rem; line-height:1.55; }
.card-meta b { color:var(--text-strong); font-weight:700; }
.card-meta .nd { color:var(--text-subtle); }
.card-step { display:flex; align-items:center; gap:0.4rem; margin-top:auto; padding-top:0.55rem; }
.card-step button { width:34px; height:34px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); font-size:1.2rem; font-weight:700; color:var(--text-strong); display:flex; align-items:center; justify-content:center; }
.card-step button:active { background:var(--punch); color:#fff; border-color:var(--punch); }
.card-step .q { flex:1; text-align:center; font-family:var(--font-mono); font-weight:700; font-size:0.95rem; }

/* thumb (carrito) */
.thumb { width:50px; height:50px; border-radius:9px; overflow:hidden; flex-shrink:0; background:var(--surface-2); position:relative; display:flex; align-items:center; justify-content:center; }
.thumb img { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; }
.thumb .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-300); z-index:0; }
.thumb .ph svg { width:20px; height:20px; stroke:currentColor; fill:none; }

/* ===== CART ===== */
.cart-line { background:var(--surface-1); border:1px solid var(--border-soft); border-radius:14px; padding:0.85rem; margin-bottom:0.6rem; }
.cart-line .ctop { display:flex; align-items:center; gap:0.7rem; }
.cart-line .thumb { width:50px; height:50px; border-radius:9px; }
.cart-line .thumb .ph svg { width:20px; height:20px; }
.cart-line .cmeta { flex:1; min-width:0; }
.cart-line .pname { font-size:0.9rem; font-weight:600; color:var(--text-strong); }
.cart-line .pcode { font-family:var(--font-mono); font-size:0.7rem; font-weight:600; color:var(--electric); }
.cart-line .rm { color:var(--error); font-size:0.78rem; font-weight:700; flex-shrink:0; }
.cart-line .row2 { display:flex; align-items:flex-end; gap:0.75rem; margin-top:0.65rem; flex-wrap:wrap; }
.cart-field { display:flex; flex-direction:column; gap:3px; }
.cart-field label { font-family:var(--font-mono); font-size:0.6rem; font-weight:600; color:var(--text-subtle); text-transform:uppercase; letter-spacing:0.08em; }
.cart-field input { width:92px; padding:0.45rem 0.55rem; border:1px solid var(--border); border-radius:8px; background:var(--surface-1); color:var(--text-strong); font-family:var(--font-mono); font-size:0.9rem; }
.cart-field input:focus { outline:none; border-color:var(--punch); }
.cart-line .cajas { font-family:var(--font-mono); font-size:0.66rem; color:var(--text-subtle); margin-top:0.5rem; text-transform:uppercase; letter-spacing:0.06em; }
.cart-line .ltotal { margin-left:auto; font-family:var(--font-mono); font-weight:800; font-size:1.05rem; color:var(--text-strong); }

/* ===== FOOTER ===== */
.footer { position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--bg-elevated); border-top:1px solid var(--border); padding:0.75rem 1rem calc(0.75rem + var(--safe-bottom)); box-shadow:0 -6px 22px rgba(0,0,0,0.10); }
.footer .totrow { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.6rem; }
.footer .totlbl { font-family:var(--font-mono); font-size:0.7rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.12em; }
.footer .totval { font-family:var(--font-mono); font-size:1.45rem; font-weight:700; color:var(--punch); }
.footer .acts { display:flex; gap:0.5rem; }
.footer .acts button { flex:1; padding:0.75rem; border-radius:11px; font-weight:800; font-size:0.84rem; transition:transform .1s, background .15s; }
.footer .acts button:active { transform:scale(0.97); }
.btn-doc { background:var(--surface-2); color:var(--text-strong); border:1px solid var(--border); }
.btn-sap { background:var(--cta); color:var(--cta-text); }
.btn-sap:disabled, .btn-doc:disabled { opacity:0.4; }

/* ===== MODAL ===== */
.modal-overlay { position:fixed; inset:0; background:var(--overlay); z-index:60; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s ease; }
.modal { background:var(--bg-elevated); width:100%; max-width:560px; max-height:88vh; border-radius:20px 20px 0 0; display:flex; flex-direction:column; overflow:hidden; }
@media (min-width:600px){ .modal-overlay{align-items:center;} .modal{border-radius:20px;} }
.modal-head { padding:1.05rem 1.25rem; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:0.75rem; }
.modal-head h3 { font-family:var(--font-serif); font-size:1.2rem; font-weight:600; flex:1; }
.modal-head .x { font-size:1.6rem; color:var(--text-muted); width:32px; height:32px; }
.modal-search { padding:0.8rem 1.25rem; border-bottom:1px solid var(--border-soft); }
.modal-search input { width:100%; padding:0.65rem 0.9rem; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text); font-size:0.95rem; }
.modal-search input:focus { outline:none; border-color:var(--punch); }
.modal-list { flex:1; overflow-y:auto; padding:0.5rem 0; }
.sup-item { width:100%; text-align:left; padding:0.85rem 1.25rem; border-bottom:1px solid var(--border-soft); display:block; }
.sup-item:active { background:var(--surface-2); }
.sup-item .n { font-weight:700; font-size:0.93rem; color:var(--text-strong); }
.sup-item .d { font-family:var(--font-mono); font-size:0.72rem; color:var(--text-muted); margin-top:2px; }

#toast { position:fixed; bottom:calc(7rem + var(--safe-bottom)); left:50%; transform:translateX(-50%); background:var(--ink-900); color:#fff; padding:0.75rem 1.15rem; border-radius:12px; font-size:0.85rem; font-weight:600; z-index:90; max-width:90%; text-align:center; box-shadow:var(--shadow-soft); }
#toast.err { background:var(--error); }
.spinner { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--punch); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="dark-hero">
  <div class="hero-wrap">
    <div class="brand-logo login-logo">JFK<sup>&reg;</sup></div>
    <div class="angle-mark"></div>
    <div class="tagline">Conecta tu estilo.</div>
    <div class="sub-mono">Portal de Compras · Reposición</div>
    <div class="login-card">
      <label>Correo</label>
      <input id="login-email" type="email" autocomplete="username" placeholder="tucorreo@jfkintl.com">
      <label>PIN</label>
      <input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" maxlength="6">
      <div class="login-err" id="login-err"></div>
      <button class="login-btn" id="login-btn">Entrar</button>

</div>

<!-- HOME / INICIO -->
<div id="screen-home" class="dark-hero hidden">
  <div class="home-topbar">
    <span class="spacer"></span>
    <button class="icon-btn" id="home-theme" title="Tema">
      <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
    </button>
    <button class="icon-btn" id="home-logout" title="Salir">
      <svg viewBox="0 0 24 24" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
  <div class="home-hero">
    <div class="brand-logo home-logo">JFK<sup>&reg;</sup></div>
    <div class="angle-mark"></div>
    <div class="tagline">Conecta tu estilo.</div>
    <div class="sub-mono">Portal de Compras · Reposición</div>
    <div class="home-greet" id="home-greet"></div>
  </div>
  <div class="home-cards">
    <button class="home-card primary" id="home-start">
      <span class="hc-icon"><svg viewBox="0 0 24 24" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span>
      <span class="hc-text"><span class="hc-title">Nueva reposición</span><span class="hc-desc">Elige un proveedor y arma tu orden de compra</span></span>
      <span class="hc-arrow">→</span>
    </button>
    <button class="home-card" id="home-continue" style="display:none;">
      <span class="hc-icon"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></span>
      <span class="hc-text"><span class="hc-title">Continuar pedido</span><span class="hc-desc" id="home-continue-desc"></span></span>
      <span class="hc-arrow">→</span>
    </button>
    <div class="home-stat" id="home-stat">Cargando proveedores…</div>

</div>

<!-- APP -->
<div id="screen-app" class="hidden">
  <header class="app-header">
    <span class="brand">JFK<sup>&reg;</sup></span>
    <span class="tag">Compras</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-home" title="Inicio">
      <svg viewBox="0 0 24 24" stroke-width="2"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/><path d="M9 21v-6h6v6"/></svg>
    </button>
    <button class="icon-btn" id="btn-theme" title="Tema">
      <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
    </button>
  </header>

  <div class="supplier-bar">
    <div class="info">
      <div class="lbl">Proveedor</div>
      <div class="name" id="sup-name">Ninguno seleccionado</div>
      <div class="meta" id="sup-meta"></div>
    </div>
    <button class="btn-pill" id="btn-pick-supplier">Cambiar</button>
  </div>

  <div class="tabbar">
    <button id="tab-cat" class="active">Productos</button>

  </div>

  <div id="view-cat">
    <div class="search-row">
      <input id="prod-search" type="search" placeholder="Filtrar productos de este proveedor…">
    </div>
    <div class="list" id="prod-list"></div>
  </div>

  <div id="view-cart" class="hidden">
    <div class="list" id="cart-list"><div class="empty">Aún no agregas productos a la reposición.</div></div>
  </div>

  <div class="footer">
    <div class="totrow"><span class="totlbl">Total compra</span><span class="totval" id="grand-total">$0.00</span></div>
    <div class="acts">
      <button class="btn-doc" id="btn-pdf" disabled>PDF</button>
      <button class="btn-doc" id="btn-xls" disabled>Excel</button>
      <button class="btn-sap" id="btn-sap" disabled>Crear en SAP</button>
    </div>
  </div>
</div>

<!-- SUPPLIER MODAL -->
<div id="supplier-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head"><h3>Elegir proveedor</h3><button class="x" id="sup-modal-x">×</button></div>
    <div class="modal-search"><input id="sup-search" type="search" placeholder="Buscar por nombre, código o RUC…"></div>
    <div class="modal-list" id="sup-list"><div class="empty"><div class="spinner"></div></div></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
/* ===== CONFIG ===== */
const SUPABASE_URL = 'https://gpighopguwafnxouejfb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FfCiha0_CJT0rJts1ifzqg_tmFzo0DC';
const SAP_PO_ENDPOINT = '/.netlify/functions/crear-compra-sap';
const PRODUCT_IMG_BASE = SUPABASE_URL + '/storage/v1/object/public/productos';
let supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const BOX_SVG = '<svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';

/* ===== STATE ===== */
let currentUser = null, currentSupplier = null;
let cart = {}, allSuppliers = [], supplierItems = [], prodCache = {};

/* ===== HELPERS ===== */
const $ = (id) => document.getElementById(id);
function money(n) { const v = Number(n); return '$' + (isNaN(v) ? 0 : v).toFixed(2); }
function num(n) { const v = Number(n); return isNaN(v) ? '0' : (Math.round(v * 100) / 100).toLocaleString('es'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function q(s) { return String(s).replace(/'/g, "\\'"); }
function showToast(msg, isErr) { const t = $('toast'); t.textContent = msg; t.className = isErr ? 'err' : ''; setTimeout(() => t.classList.add('hidden'), 3400); }
function cartItems() { return Object.values(cart).filter(i => i.qty > 0); }
function boxOf(p) { return (p && p.items_per_box && p.items_per_box > 1) ? p.items_per_box : 1; }
function thumbHTML(code, big) {
  const cls = big ? 'thumb' : 'thumb';
  return '<div class="' + cls + '"><span class="ph">' + BOX_SVG + '</span>' +
    '<img loading="lazy" alt="" src="' + PRODUCT_IMG_BASE + '/' + encodeURIComponent(code) + '.jpg" onerror="this.style.display=\'none\'"></div>';
}

/* ===== THEME ===== */
function toggleTheme() {
  const cur = localStorage.getItem('jfk-theme-pref') || 'auto';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('jfk-theme-pref', next);
  document.documentElement.setAttribute('data-theme', next);
}
$('btn-theme').addEventListener('click', toggleTheme);
$('home-theme').addEventListener('click', toggleTheme);

/* ===== SCREENS ===== */
function show(screen) {
  $('screen-login').classList.toggle('hidden', screen !== 'login');
  $('screen-home').classList.toggle('hidden', screen !== 'home');
  $('screen-app').classList.toggle('hidden', screen !== 'app');
}
async function showHome() {
  show('home');
  const name = (currentUser && currentUser.name) ? currentUser.name.split(' ')[0] : '';
  $('home-greet').textContent = name ? ('Hola, ' + name + ' 👋') : '';
  // continuar pedido si ya hay proveedor + carrito
  const hasDraft = currentSupplier && cartItems().length > 0;
  $('home-continue').style.display = hasDraft ? 'flex' : 'none';
  if (hasDraft) $('home-continue-desc').textContent = currentSupplier.name + ' · ' + cartItems().length + ' productos';
  // contador de proveedores
  if (allSuppliers.length === 0) await loadSuppliers(true);
  $('home-stat').textContent = allSuppliers.length + ' proveedores con compras';
}

/* ===== LOGIN ===== */
$('login-btn').addEventListener('click', doLogin);
$('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const email = $('login-email').value.trim().toLowerCase();
  const pin = $('login-pin').value.trim();
  const err = $('login-err'); err.textContent = '';
  if (!email || !pin) { err.textContent = 'Ingresa correo y PIN.'; return; }
  try {
    const { data: seller, error } = await supa.from('sellers')
      .select('id, name, email, pin_hash, role, active, failed_attempts, locked_until')
      .eq('email', email).maybeSingle();
    if (error) { err.textContent = 'Error de conexión.'; return; }
    if (!seller) { err.textContent = 'Usuario no encontrado.'; return; }
    if (!seller.active) { err.textContent = 'Usuario inactivo.'; return; }
    if (seller.locked_until && new Date(seller.locked_until) > new Date()) { err.textContent = 'Cuenta bloqueada temporalmente.'; return; }
    const ok = dcodeIO.bcrypt.compareSync(pin, seller.pin_hash);
    if (!ok) {
      const attempts = (seller.failed_attempts || 0) + 1;
      const upd = { failed_attempts: attempts };
      if (attempts >= 5) upd.locked_until = new Date(Date.now() + 15 * 60000).toISOString();
      supa.from('sellers').update(upd).eq('id', seller.id);
      err.textContent = 'PIN incorrecto.'; return;
    }
    if (seller.role !== 'admin') { err.textContent = 'El portal de compras es solo para administradores.'; return; }
    supa.from('sellers').update({ failed_attempts: 0, locked_until: null, last_login: new Date().toISOString() }).eq('id', seller.id);
    currentUser = seller;
    showHome();
  } catch (e) { err.textContent = 'Error: ' + e.message; }
}

function doLogout() {
  currentUser = null; currentSupplier = null; cart = {}; prodCache = {}; supplierItems = [];
  $('login-pin').value = ''; resetCatalog(); updateFooter(); show('login');
}
$('home-logout').addEventListener('click', doLogout);
$('btn-logout') && $('btn-logout').addEventListener('click', doLogout);

/* ===== HOME ACTIONS ===== */
$('home-start').addEventListener('click', openSupplierModal);
$('home-continue').addEventListener('click', () => { show('app'); switchTab('cat'); });
$('btn-home').addEventListener('click', showHome);

/* ===== TABS ===== */
$('tab-cat').addEventListener('click', () => switchTab('cat'));
$('tab-cart').addEventListener('click', () => switchTab('cart'));
function switchTab(t) {
  $('tab-cat').classList.toggle('active', t === 'cat');
  $('tab-cart').classList.toggle('active', t === 'cart');
  $('view-cat').classList.toggle('hidden', t !== 'cat');
  $('view-cart').classList.toggle('hidden', t !== 'cart');
  if (t === 'cart') renderCart();
}

/* ===== SUPPLIERS ===== */
$('btn-pick-supplier').addEventListener('click', openSupplierModal);
$('sup-modal-x').addEventListener('click', () => $('supplier-modal').classList.add('hidden'));
$('supplier-modal').addEventListener('click', e => { if (e.target === $('supplier-modal')) $('supplier-modal').classList.add('hidden'); });
$('sup-search').addEventListener('input', e => filterSuppliers(e.target.value));

async function openSupplierModal() {
  $('supplier-modal').classList.remove('hidden');
  $('sup-search').value = '';
  if (allSuppliers.length === 0) { $('sup-list').innerHTML = '<div class="empty"><div class="spinner"></div></div>'; await loadSuppliers(); }
  renderSuppliers(allSuppliers);
  setTimeout(() => $('sup-search').focus(), 100);
}

async function loadSuppliers(silent) {
  allSuppliers = [];
  let from = 0; const batch = 1000;
  while (true) {
    const { data, error } = await supa.from('suppliers')
      .select('sap_card_code, name, tax_id, city, current_balance, currency')
      .eq('active', true).eq('has_purchases', true)
      .order('name').range(from, from + batch - 1);
    if (error) { if (!silent) $('sup-list').innerHTML = '<div class="empty">Error: ' + esc(error.message) + '</div>'; return; }
    if (!data || data.length === 0) break;
    allSuppliers = allSuppliers.concat(data);
    if (data.length < batch) break;
    from += batch;
  }
}

function filterSuppliers(term) {
  term = (term || '').toLowerCase().trim();
  const f = !term ? allSuppliers : allSuppliers.filter(s =>
    (s.name || '').toLowerCase().includes(term) || (s.sap_card_code || '').toLowerCase().includes(term) || (s.tax_id || '').toLowerCase().includes(term));
  renderSuppliers(f);
}

function renderSuppliers(list) {
  const el = $('sup-list');
  if (!list.length) { el.innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
  el.innerHTML = list.slice(0, 400).map(s => {
    const meta = [s.sap_card_code, s.tax_id ? 'RUC ' + s.tax_id : '', s.city].filter(Boolean).join(' · ');
    return '<button class="sup-item" onclick="selectSupplier(\'' + q(esc(s.sap_card_code)) + '\')">' +
      '<div class="n">' + esc(s.name) + '</div><div class="d">' + esc(meta) + '</div></button>';
  }).join('');
}

async function selectSupplier(code) {
  const s = allSuppliers.find(x => x.sap_card_code === code);
  if (!s) return;
  currentSupplier = s;
  $('sup-name').textContent = s.name;
  $('sup-meta').textContent = [s.sap_card_code, s.tax_id ? 'RUC ' + s.tax_id : ''].filter(Boolean).join(' · ');
  $('supplier-modal').classList.add('hidden');
  show('app'); switchTab('cat');
  await loadSupplierItems(code);
  updateFooter();
}

async function loadSupplierItems(code) {
  const el = $('prod-list');
  el.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  $('prod-search').value = '';
  let hist = []; let from = 0; const B = 1000;
  while (true) {
    const { data, error } = await supa.from('supplier_item_history')
      .select('item_code, item_name, last_price, last_date, last_qty, total_qty, total_amount, num_purchases')
      .eq('supplier_card_code', code).order('total_qty', { ascending: false }).range(from, from + B - 1);
    if (error) { el.innerHTML = '<div class="empty">Error: ' + esc(error.message) + '</div>'; return; }
    if (!data || !data.length) break;
    hist = hist.concat(data);
    if (data.length < B) break;
    from += B;
  }
  if (!hist.length) { supplierItems = []; prodCache = {}; el.innerHTML = '<div class="empty">Este proveedor no tiene productos en el historial.</div>'; return; }
  const pmap = {}; const codes = hist.map(h => h.item_code);
  for (let i = 0; i < codes.length; i += 300) {
    const { data } = await supa.from('products').select('sap_item_code, name, stock, items_per_box, fob_cost').in('sap_item_code', codes.slice(i, i + 300));
    (data || []).forEach(p => { pmap[p.sap_item_code] = p; });
  }
  supplierItems = hist.map(h => {
    const p = pmap[h.item_code] || {};
    return {
      item_code: h.item_code, name: p.name || h.item_name || h.item_code,
      last_price: h.last_price, last_date: h.last_date, last_qty: h.last_qty,
      total_qty: h.total_qty, total_amount: h.total_amount, num_purchases: h.num_purchases,
      stock: (p.stock != null ? p.stock : null), items_per_box: (p.items_per_box || 1), fob_cost: (p.fob_cost != null ? p.fob_cost : null)
    };
  });
  prodCache = {}; supplierItems.forEach(it => { prodCache[it.item_code] = it; });
  renderItems(supplierItems);
}

$('prod-search').addEventListener('input', e => {
  const t = (e.target.value || '').toLowerCase().trim();
  if (!supplierItems.length) return;
  const f = !t ? supplierItems : supplierItems.filter(i => (i.name || '').toLowerCase().includes(t) || (i.item_code || '').toLowerCase().includes(t));
  renderItems(f);
});

function renderItems(list) {
  const el = $('prod-list');
  if (!list.length) { el.innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
  const head = '<div class="count-line">' + list.length + ' producto' + (list.length === 1 ? '' : 's') + ' que le compras</div>';
  const cards = list.map(p => {
    const code = p.item_code, inCart = cart[code] ? cart[code].qty : 0, box = boxOf(p);
    const lastp = (p.last_price != null) ? money(p.last_price) : '—';
    const stockTxt = (p.stock != null) ? ('<b>' + num(p.stock) + '</b>') : '<span class="nd">s/d</span>';
    const totq = (p.total_qty != null) ? num(p.total_qty) : '—';
    const lastd = p.last_date ? esc(p.last_date) : '—';
    const bultoLine = box > 1 ? ' · Bulto <b>' + box + '</b>' : '';
    const badge = inCart > 0 ? '<span class="badge-cart">' + inCart + '</span>' : '';
    return '<div class="card' + (inCart > 0 ? ' has' : '') + '">' +
      '<div class="card-photo"><span class="ph">' + BOX_SVG + '</span>' + badge +
        '<img loading="lazy" alt="" src="' + PRODUCT_IMG_BASE + '/' + encodeURIComponent(code) + '.jpg" onerror="this.style.display=\'none\'"></div>' +
      '<div class="card-body">' +
        '<div class="pcode">' + esc(code) + '</div>' +
        '<div class="pname">' + esc(p.name) + '</div>' +
        '<div class="card-price"><small>Últ. precio</small>' + lastp + '</div>' +
        '<div class="card-meta">Inv ' + stockTxt + bultoLine + '<br>Comprado <b>' + totq + '</b> · ' + lastd + '</div>' +
        '<div class="card-step">' +
          '<button onclick="changeQty(\'' + q(esc(code)) + '\',-1)">−</button>' +
          '<span class="q" id="q-' + esc(code) + '">' + inCart + '</span>' +
          '<button onclick="changeQty(\'' + q(esc(code)) + '\',1)">+</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  el.innerHTML = head + '<div class="grid">' + cards + '</div>';
}

function changeQty(code, dir) {
  const p = prodCache[code]; if (!p) return;
  const step = boxOf(p);
  if (!cart[code]) {
    const defPrice = (p.last_price != null) ? Number(p.last_price) : (p.fob_cost != null ? Number(p.fob_cost) : 0);
    cart[code] = { qty: 0, price: defPrice, product: p };
  }
  cart[code].qty = Math.max(0, cart[code].qty + dir * step);
  if (cart[code].qty === 0) delete cart[code];
  const newQty = cart[code] ? cart[code].qty : 0;
  const qEl = $('q-' + code);
  if (qEl) {
    qEl.textContent = newQty;
    const card = qEl.closest('.card');
    if (card) {
      card.classList.toggle('has', newQty > 0);
      const photo = card.querySelector('.card-photo');
      let badge = photo ? photo.querySelector('.badge-cart') : null;
      if (newQty > 0) {
        if (!badge && photo) { badge = document.createElement('span'); badge.className = 'badge-cart'; photo.appendChild(badge); }
        if (badge) badge.textContent = newQty;
      } else if (badge) { badge.remove(); }
    }
  }
  updateFooter();
}

/* ===== CART ===== */
function renderCart() {
  const items = cartItems(); const el = $('cart-list');
  if (!items.length) { el.innerHTML = '<div class="empty">Aún no agregas productos a la reposición.</div>'; return; }
  el.innerHTML = items.map(i => {
    const code = i.product.item_code, box = boxOf(i.product);
    const cajas = box > 1 ? (' · ' + (Math.round((i.qty / box) * 100) / 100) + ' caja' + ((i.qty / box) === 1 ? '' : 's')) : '';
    const lt = i.qty * i.price;
    return '<div class="cart-line">' +
      '<div class="ctop">' + thumbHTML(code) +
        '<div class="cmeta"><div class="pcode">' + esc(code) + '</div><div class="pname">' + esc(i.product.name) + '</div></div>' +
        '<button class="rm" onclick="removeLine(\'' + q(esc(code)) + '\')">Quitar</button>' +
      '</div>' +
      '<div class="row2">' +
        '<div class="cart-field"><label>Cantidad</label><input type="number" min="0" step="1" value="' + i.qty + '" onchange="setQty(\'' + q(esc(code)) + '\',this.value)"></div>' +
        '<div class="cart-field"><label>Costo unit.</label><input type="number" min="0" step="0.01" value="' + i.price + '" onchange="setPrice(\'' + q(esc(code)) + '\',this.value)"></div>' +
        '<span class="ltotal">' + money(lt) + '</span>' +
      '</div>' +
      (box > 1 ? '<div class="cajas">Bulto de ' + box + cajas + '</div>' : '') +
    '</div>';
  }).join('');
}
function setQty(code, val) { if (!cart[code]) return; const qn = Math.max(0, Math.floor(Number(val) || 0)); cart[code].qty = qn; if (qn === 0) delete cart[code]; renderCart(); updateFooter(); }
function setPrice(code, val) { if (!cart[code]) return; cart[code].price = Math.max(0, Number(val) || 0); renderCart(); updateFooter(); }
function removeLine(code) { delete cart[code]; renderCart(); updateFooter(); const qEl = $('q-' + code); if (qEl) { qEl.textContent = 0; const card = qEl.closest('.card'); if (card) { card.classList.remove('has'); const b = card.querySelector('.badge-cart'); if (b) b.remove(); } } }

/* ===== TOTALS ===== */
function grandTotal() { return cartItems().reduce((s, i) => s + i.qty * i.price, 0); }
function updateFooter() {
  const count = cartItems().length;
  $('cart-count').textContent = count;
  $('grand-total').textContent = money(grandTotal());
  const ready = count > 0 && !!currentSupplier;
  $('btn-pdf').disabled = !ready; $('btn-xls').disabled = !ready; $('btn-sap').disabled = !ready;
}
function resetCatalog() {
  currentSupplier = null; supplierItems = []; prodCache = {};
  $('sup-name').textContent = 'Ninguno seleccionado'; $('sup-meta').textContent = '';
  $('prod-list').innerHTML = '<div class="empty">Elige un proveedor para ver los productos que le compras.</div>';
  $('cart-list').innerHTML = '<div class="empty">Aún no agregas productos a la reposición.</div>';
}

/* ===== EXPORTS ===== */
function todayStr() { return new Date().toISOString().slice(0, 10); }
function poFileName(ext) { return 'OC_' + (currentSupplier ? currentSupplier.sap_card_code : 'OC') + '_' + todayStr() + '.' + ext; }
function downloadBlob(blob, name) { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); }
function cajasDe(i) { const box = boxOf(i.product); return box > 1 ? String(Math.round((i.qty / box) * 100) / 100) : ''; }

$('btn-pdf').addEventListener('click', generatePDF);
$('btn-xls').addEventListener('click', generateExcel);
$('btn-sap').addEventListener('click', enviarSAP);

function generatePDF() {
  const items = cartItems(); if (!items.length || !currentSupplier) return;
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'letter' }); const M = 14;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.text('JFK', M, 18);
  doc.setFontSize(13); doc.text('ORDEN DE COMPRA', 210 - M, 18, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text('JFK International, S.A.', M, 25);
  doc.setTextColor(20); doc.setFontSize(10); doc.text('Proveedor: ' + currentSupplier.name, M, 36);
  let y = 41;
  if (currentSupplier.sap_card_code) { doc.text('Código: ' + currentSupplier.sap_card_code, M, y); y += 5; }
  if (currentSupplier.tax_id) { doc.text('RUC: ' + currentSupplier.tax_id, M, y); y += 5; }
  doc.text('Fecha: ' + todayStr(), 210 - M, 36, { align: 'right' });
  const body = items.map(i => [i.product.item_code, i.product.name || '', String(i.qty), cajasDe(i), money(i.price), money(i.qty * i.price)]);
  doc.autoTable({
    startY: y + 3, head: [['Código', 'Descripción', 'Cant', 'Cajas', 'Costo', 'Total']], body,
    styles: { fontSize: 8.5, cellPadding: 2 }, headStyles: { fillColor: [14, 16, 22], textColor: 255 },
    columnStyles: { 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' } },
    margin: { left: M, right: M }
  });
  const endY = doc.lastAutoTable.finalY || (y + 10);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('TOTAL: ' + money(grandTotal()), 210 - M, endY + 9, { align: 'right' });
  doc.save(poFileName('pdf')); showToast('PDF generado');
}

async function generateExcel() {
  const items = cartItems(); if (!items.length || !currentSupplier) return;
  if (typeof ExcelJS === 'undefined') { showToast('Excel no cargó, recarga la página', true); return; }
  const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('Orden de Compra');
  ws.columns = [
    { header: 'Código', key: 'code', width: 16 }, { header: 'Descripción', key: 'name', width: 46 },
    { header: 'Cantidad', key: 'qty', width: 11 }, { header: 'Cajas', key: 'cajas', width: 9 },
    { header: 'Costo Unit.', key: 'price', width: 13 }, { header: 'Total', key: 'total', width: 13 }
  ];
  ws.spliceRows(1, 0, ['ORDEN DE COMPRA — JFK International, S.A.'], ['Proveedor:', currentSupplier.name],
    ['Código:', currentSupplier.sap_card_code || ''], ['RUC:', currentSupplier.tax_id || ''], ['Fecha:', todayStr()], []);
  const headerRow = 7; ws.getRow(headerRow).values = ['Código', 'Descripción', 'Cantidad', 'Cajas', 'Costo Unit.', 'Total']; ws.getRow(headerRow).font = { bold: true };
  items.forEach(i => ws.addRow({ code: i.product.item_code, name: i.product.name, qty: i.qty, cajas: cajasDe(i), price: Number(i.price), total: i.qty * i.price }));
  ws.getColumn('price').numFmt = '"$"#,##0.00'; ws.getColumn('total').numFmt = '"$"#,##0.00';
  ws.addRow({}); const totRow = ws.addRow({ price: 'TOTAL', total: grandTotal() });
  totRow.getCell('price').font = { bold: true }; totRow.getCell('total').font = { bold: true }; totRow.getCell('total').numFmt = '"$"#,##0.00';
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), poFileName('xlsx'));
  showToast('Excel generado');
}

async function enviarSAP() {
  const items = cartItems(); if (!items.length || !currentSupplier) return;
  if (!confirm('¿Crear esta Orden de Compra en SAP para "' + currentSupplier.name + '"?\n' + items.length + ' productos · Total ' + money(grandTotal()))) return;
  const btn = $('btn-sap'); const prev = btn.textContent; btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const payload = { CardCode: currentSupplier.sap_card_code, DocDate: todayStr(), Comments: 'Reposición desde Portal de Compras JFK',
      DocumentLines: items.map(i => ({ ItemCode: i.product.item_code, Quantity: i.qty, Price: Number(i.price) })) };
    const res = await fetch(SAP_PO_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    let data = {}; try { data = await res.json(); } catch (e) {}
    if (res.ok && data.ok) {
      showToast('✓ Orden de compra creada en SAP — #' + (data.DocNum || data.DocEntry));
      cart = {}; renderCart(); switchTab('cat'); if (currentSupplier) renderItems(supplierItems);
    } else if (res.status === 404) {
      showToast('La función de SAP no está publicada (404). Súbela a Netlify primero.', true);
    } else {
      showToast('SAP: ' + (data.error || ('Error ' + res.status)), true);
    }
  } catch (e) { showToast('Error de red: ' + e.message, true); }
  finally { btn.textContent = prev; updateFooter(); }
}

/* ===== INIT ===== */
resetCatalog(); updateFooter(); show('login');
</script>
</body>
</html>
