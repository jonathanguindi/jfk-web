<script>
// THEME BOOTSTRAP
(function() {
  var pref = localStorage.getItem('jfk-theme-pref') || 'auto';
  var root = document.documentElement;
  root.setAttribute('data-theme-pref', pref);
  if (pref === 'light' || pref === 'dark') root.setAttribute('data-theme', pref);
  function syncThemeColor() {
    var isDark;
    if (pref === 'dark') isDark = true;
    else if (pref === 'light') isDark = false;
    else isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', isDark ? '#0E1016' : '#FFFBF2');
  }
  syncThemeColor();
})();
</script>

<style>
:root {
  --ink-900:#0E1016; --ink-800:#1A1D22; --ink-700:#34363B; --ink-600:#54565B;
  --ink-500:#6E7178; --ink-400:#98999B; --ink-300:#C4C6CA; --ink-200:#D4D6DA;
  --ink-100:#E5E7EA; --ink-50:#F4F5F7;
  --sun:#FFB627; --punch:#FF6B35; --punch-hover:#E55A28; --fire:#E94734;
  --electric:#009FE3; --ocean:#0069A7; --neon:#00D4D0; --jade:#00B0AD;
  --cream:#FFFBF2; --vanilla:#FFF4D6;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-serif:'Fraunces',Georgia,serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --bg:var(--cream); --bg-elevated:#FFFFFF; --surface-1:#FFFFFF; --surface-2:var(--ink-50);
  --text:var(--ink-900); --text-strong:var(--ink-900); --text-muted:var(--ink-500); --text-subtle:var(--ink-400);
  --border:var(--ink-200); --border-soft:var(--ink-100);
  --accent:var(--electric); --success:var(--jade); --error:var(--fire);
  --cta:var(--punch); --cta-hover:var(--punch-hover); --cta-text:#FFFFFF;
  --header-bg:var(--ink-900); --header-text:var(--cream);
  --overlay:rgba(14,16,22,0.5);
  --shadow-soft:0 10px 30px rgba(14,16,22,0.08);
}
[data-theme="dark"] {
  --bg:var(--ink-900); --bg-elevated:var(--ink-800); --surface-1:var(--ink-800); --surface-2:var(--ink-700);
  --text:var(--cream); --text-strong:#FFFFFF; --text-muted:var(--ink-400); --text-subtle:var(--ink-500);
  --border:var(--ink-700); --border-soft:var(--ink-800);
  --accent:var(--electric); --success:var(--neon); --error:var(--punch);
  --header-bg:var(--ink-800); --overlay:rgba(0,0,0,0.6);
  --shadow-soft:0 10px 30px rgba(0,0,0,0.4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:var(--ink-900); --bg-elevated:var(--ink-800); --surface-1:var(--ink-800); --surface-2:var(--ink-700);
    --text:var(--cream); --text-strong:#FFFFFF; --text-muted:var(--ink-400); --text-subtle:var(--ink-500);
    --border:var(--ink-700); --border-soft:var(--ink-800);
    --success:var(--neon); --error:var(--punch); --header-bg:var(--ink-800); --overlay:rgba(0,0,0,0.6);
    --shadow-soft:0 10px 30px rgba(0,0,0,0.4);
  }
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
body {
  font-family:var(--font-sans); background:var(--bg); color:var(--text);
  line-height:1.5; min-height:100vh; min-height:100dvh; overflow-x:hidden;
}
.hidden { display:none !important; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input { font-family:inherit; }

/* ---------- LOGIN ---------- */
#screen-login {
  min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:2rem 1.25rem; background:var(--header-bg); color:var(--cream);
}
.login-logo { font-family:var(--font-serif); font-weight:600; font-size:2.2rem; letter-spacing:-1px; margin-bottom:0.25rem; }
.login-sub { color:var(--ink-400); font-size:0.9rem; margin-bottom:2rem; }
.login-card { width:100%; max-width:360px; background:var(--ink-800); border:1px solid var(--ink-700); border-radius:18px; padding:1.5rem; }
.login-card label { display:block; font-size:0.78rem; font-weight:700; color:var(--ink-400); margin:0 0 0.35rem; text-transform:uppercase; letter-spacing:0.04em; }
.login-card input {
  width:100%; padding:0.8rem 1rem; margin-bottom:1rem; border-radius:10px;
  border:1px solid var(--ink-700); background:var(--ink-900); color:var(--cream); font-size:1rem;
}
.login-card input:focus { outline:none; border-color:var(--punch); }
.login-btn { width:100%; background:var(--cta); color:var(--cta-text); padding:0.85rem; border-radius:10px; font-weight:700; font-size:1rem; }
.login-btn:active { background:var(--cta-hover); }
.login-err { color:#FFB4A6; font-size:0.85rem; min-height:1.2em; margin-bottom:0.75rem; text-align:center; }

/* ---------- APP HEADER ---------- */
.app-header {
  position:sticky; top:0; z-index:30; background:var(--header-bg); color:var(--header-text);
  padding:calc(0.7rem + var(--safe-top)) 1rem 0.7rem; display:flex; align-items:center; gap:0.75rem;
}
.app-header .brand { font-family:var(--font-serif); font-weight:600; font-size:1.25rem; letter-spacing:-0.5px; }
.app-header .tag { font-size:0.7rem; font-weight:700; color:var(--punch); text-transform:uppercase; letter-spacing:0.08em; }
.app-header .spacer { flex:1; }
.icon-btn { width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; }
.icon-btn svg { width:18px; height:18px; stroke:currentColor; }

/* supplier bar */
.supplier-bar {
  background:var(--bg-elevated); border-bottom:1px solid var(--border-soft);
  padding:0.85rem 1rem; display:flex; align-items:center; gap:0.75rem;
}
.supplier-bar .info { flex:1; min-width:0; }
.supplier-bar .lbl { font-size:0.68rem; font-weight:700; color:var(--text-subtle); text-transform:uppercase; letter-spacing:0.06em; }
.supplier-bar .name { font-weight:700; font-size:0.98rem; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.supplier-bar .meta { font-size:0.75rem; color:var(--text-muted); }
.btn-pill { background:var(--cta); color:var(--cta-text); padding:0.55rem 0.9rem; border-radius:999px; font-weight:700; font-size:0.82rem; white-space:nowrap; }
.btn-pill.ghost { background:var(--surface-2); color:var(--text-strong); }

/* search */
.search-row { padding:0.7rem 1rem; background:var(--bg-elevated); border-bottom:1px solid var(--border-soft); }
.search-row input {
  width:100%; padding:0.6rem 1rem 0.6rem 2.3rem; background:var(--surface-2);
  border:1px solid var(--border-soft); border-radius:10px; font-size:0.9rem; color:var(--text);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236E7178' stroke-width='2'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
  background-repeat:no-repeat; background-position:0.65rem center; background-size:15px;
}
.search-row input:focus { outline:none; border-color:var(--punch); }

/* product list */
.list { padding:0.75rem 1rem 7rem; }
.empty { text-align:center; color:var(--text-muted); padding:3rem 1rem; font-size:0.9rem; }
.prod {
  background:var(--surface-1); border:1px solid var(--border-soft); border-radius:14px;
  padding:0.8rem; margin-bottom:0.6rem; display:flex; align-items:center; gap:0.8rem;
}
.prod .pinfo { flex:1; min-width:0; }
.prod .pcode { font-size:0.72rem; font-weight:700; color:var(--accent); font-family:var(--font-sans); }
.prod .pname { font-size:0.88rem; font-weight:600; color:var(--text-strong); line-height:1.25; }
.prod .pmeta { font-size:0.74rem; color:var(--text-muted); margin-top:2px; }
.prod .pmeta b { color:var(--text-strong); }
.stepper { display:flex; align-items:center; gap:0.4rem; flex-shrink:0; }
.stepper button { width:34px; height:34px; border-radius:9px; background:var(--surface-2); font-size:1.2rem; font-weight:700; color:var(--text-strong); display:flex; align-items:center; justify-content:center; }
.stepper button:active { background:var(--border); }
.stepper .q { min-width:1.8ch; text-align:center; font-weight:700; }

/* cart */
.cart-line {
  background:var(--surface-1); border:1px solid var(--border-soft); border-radius:14px;
  padding:0.8rem; margin-bottom:0.6rem;
}
.cart-line .top { display:flex; justify-content:space-between; gap:0.5rem; }
.cart-line .pname { font-size:0.88rem; font-weight:600; color:var(--text-strong); }
.cart-line .pcode { font-size:0.72rem; font-weight:700; color:var(--accent); }
.cart-line .rm { color:var(--error); font-size:0.78rem; font-weight:700; flex-shrink:0; }
.cart-line .row2 { display:flex; align-items:center; gap:0.75rem; margin-top:0.6rem; flex-wrap:wrap; }
.cart-field { display:flex; flex-direction:column; gap:2px; }
.cart-field label { font-size:0.66rem; font-weight:700; color:var(--text-subtle); text-transform:uppercase; }
.cart-field input { width:90px; padding:0.4rem 0.5rem; border:1px solid var(--border); border-radius:8px; background:var(--surface-1); color:var(--text-strong); font-size:0.9rem; }
.cart-field input:focus { outline:none; border-color:var(--punch); }
.cart-line .ltotal { margin-left:auto; font-weight:800; color:var(--text-strong); align-self:flex-end; }

/* footer */
.footer {
  position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--bg-elevated);
  border-top:1px solid var(--border); padding:0.7rem 1rem calc(0.7rem + var(--safe-bottom));
  box-shadow:0 -6px 20px rgba(0,0,0,0.08);
}
.footer .totrow { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.55rem; }
.footer .totlbl { font-size:0.78rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; }
.footer .totval { font-size:1.3rem; font-weight:900; color:var(--text-strong); }
.footer .acts { display:flex; gap:0.5rem; }
.footer .acts button { flex:1; padding:0.7rem; border-radius:11px; font-weight:700; font-size:0.85rem; display:flex; align-items:center; justify-content:center; gap:0.35rem; }
.btn-doc { background:var(--surface-2); color:var(--text-strong); border:1px solid var(--border); }
.btn-sap { background:var(--cta); color:var(--cta-text); }
.btn-sap:disabled, .btn-doc:disabled { opacity:0.45; }

/* tabs */
.tabbar { display:flex; background:var(--bg-elevated); border-bottom:1px solid var(--border-soft); }
.tabbar button { flex:1; padding:0.7rem; font-weight:700; font-size:0.85rem; color:var(--text-muted); border-bottom:2px solid transparent; }
.tabbar button.active { color:var(--punch); border-bottom-color:var(--punch); }

/* modal */
.modal-overlay { position:fixed; inset:0; background:var(--overlay); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
.modal {
  background:var(--bg-elevated); width:100%; max-width:560px; max-height:88vh; border-radius:20px 20px 0 0;
  display:flex; flex-direction:column; overflow:hidden;
}
@media (min-width:600px){ .modal-overlay{align-items:center;} .modal{border-radius:20px;} }
.modal-head { padding:1rem 1.25rem; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:0.75rem; }
.modal-head h3 { font-size:1.05rem; font-weight:800; flex:1; }
.modal-head .x { font-size:1.5rem; color:var(--text-muted); width:32px; height:32px; }
.modal-search { padding:0.8rem 1.25rem; border-bottom:1px solid var(--border-soft); }
.modal-search input { width:100%; padding:0.65rem 0.9rem; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text); font-size:0.95rem; }
.modal-search input:focus { outline:none; border-color:var(--punch); }
.modal-list { flex:1; overflow-y:auto; padding:0.5rem 0; }
.sup-item { width:100%; text-align:left; padding:0.8rem 1.25rem; border-bottom:1px solid var(--border-soft); display:block; }
.sup-item:active { background:var(--surface-2); }
.sup-item .n { font-weight:700; font-size:0.92rem; color:var(--text-strong); }
.sup-item .d { font-size:0.76rem; color:var(--text-muted); margin-top:1px; }

/* toast */
#toast { position:fixed; bottom:calc(7rem + var(--safe-bottom)); left:50%; transform:translateX(-50%); background:var(--ink-900); color:#fff; padding:0.7rem 1.1rem; border-radius:12px; font-size:0.85rem; font-weight:600; z-index:90; max-width:90%; text-align:center; box-shadow:var(--shadow-soft); }
#toast.err { background:var(--error); }
.spinner { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--punch); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = 'https://gpighopguwafnxouejfb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FfCiha0_CJT0rJts1ifzqg_tmFzo0DC';
const SAP_PO_ENDPOINT = '/.netlify/functions/crear-compra-sap';
let supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ STATE ============ */
let currentUser = null;
let currentSupplier = null;
let cart = {};            // { sap_item_code: { qty, price, product } }
let allSuppliers = [];
let prodCache = {};       // code -> product
let searchTimer = null;

/* ============ HELPERS ============ */
const $ = (id) => document.getElementById(id);
function money(n) { const v = Number(n); return '$' + (isNaN(v) ? 0 : v).toFixed(2); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showToast(msg, isErr) {
  const t = $('toast'); t.textContent = msg; t.className = isErr ? 'err' : '';
  setTimeout(() => { t.classList.add('hidden'); }, 3200);
}
function cartItems() { return Object.values(cart).filter(i => i.qty > 0); }

/* ============ THEME ============ */
$('btn-theme').addEventListener('click', () => {
  const cur = localStorage.getItem('jfk-theme-pref') || 'auto';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('jfk-theme-pref', next);
  document.documentElement.setAttribute('data-theme', next);
});

/* ============ LOGIN ============ */
$('login-btn').addEventListener('click', doLogin);
$('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const email = $('login-email').value.trim().toLowerCase();
  const pin = $('login-pin').value.trim();
  const err = $('login-err');
  err.textContent = '';
  if (!email || !pin) { err.textContent = 'Ingresa correo y PIN.'; return; }

  try {
    const { data: seller, error } = await supa
      .from('sellers')
      .select('id, name, email, pin_hash, role, active, failed_attempts, locked_until')
      .eq('email', email)
      .maybeSingle();

    if (error) { err.textContent = 'Error de conexión.'; return; }
    if (!seller) { err.textContent = 'Usuario no encontrado.'; return; }
    if (!seller.active) { err.textContent = 'Usuario inactivo.'; return; }
    if (seller.locked_until && new Date(seller.locked_until) > new Date()) {
      err.textContent = 'Cuenta bloqueada temporalmente.'; return;
    }

    const ok = dcodeIO.bcrypt.compareSync(pin, seller.pin_hash);
    if (!ok) {
      const attempts = (seller.failed_attempts || 0) + 1;
      const upd = { failed_attempts: attempts };
      if (attempts >= 5) upd.locked_until = new Date(Date.now() + 15 * 60000).toISOString();
      supa.from('sellers').update(upd).eq('id', seller.id);
      err.textContent = 'PIN incorrecto.'; return;
    }
    if (seller.role !== 'admin') {
      err.textContent = 'El portal de compras es solo para administradores.'; return;
    }

    supa.from('sellers').update({ failed_attempts: 0, locked_until: null, last_login: new Date().toISOString() }).eq('id', seller.id);
    currentUser = seller;
    $('screen-login').classList.add('hidden');
    $('screen-app').classList.remove('hidden');
  } catch (e) {
    err.textContent = 'Error: ' + e.message;
  }
}

$('btn-logout').addEventListener('click', () => {
  currentUser = null; currentSupplier = null; cart = {}; prodCache = {};
  $('screen-app').classList.add('hidden');
  $('screen-login').classList.remove('hidden');
  $('login-pin').value = '';
  renderAll();
});

/* ============ TABS ============ */
$('tab-cat').addEventListener('click', () => switchTab('cat'));
$('tab-cart').addEventListener('click', () => switchTab('cart'));
function switchTab(t) {
  $('tab-cat').classList.toggle('active', t === 'cat');
  $('tab-cart').classList.toggle('active', t === 'cart');
  $('view-cat').classList.toggle('hidden', t !== 'cat');
  $('view-cart').classList.toggle('hidden', t !== 'cart');
  if (t === 'cart') renderCart();
}

/* ============ SUPPLIERS ============ */
$('btn-pick-supplier').addEventListener('click', openSupplierModal);
$('sup-modal-x').addEventListener('click', () => $('supplier-modal').classList.add('hidden'));
$('supplier-modal').addEventListener('click', e => { if (e.target === $('supplier-modal')) $('supplier-modal').classList.add('hidden'); });
$('sup-search').addEventListener('input', e => filterSuppliers(e.target.value));

async function openSupplierModal() {
  $('supplier-modal').classList.remove('hidden');
  $('sup-search').value = '';
  if (allSuppliers.length === 0) {
    $('sup-list').innerHTML = '<div class="empty"><div class="spinner"></div></div>';
    await loadSuppliers();
  }
  renderSuppliers(allSuppliers);
  setTimeout(() => $('sup-search').focus(), 100);
}

async function loadSuppliers() {
  allSuppliers = [];
  let from = 0; const batch = 1000;
  while (true) {
    const { data, error } = await supa
      .from('suppliers')
      .select('sap_card_code, name, tax_id, city, country, current_balance, currency')
      .eq('active', true)
      .order('name')
      .range(from, from + batch - 1);
    if (error) { $('sup-list').innerHTML = '<div class="empty">Error: ' + esc(error.message) + '</div>'; return; }
    if (!data || data.length === 0) break;
    allSuppliers = allSuppliers.concat(data);
    if (data.length < batch) break;
    from += batch;
  }
}

function filterSuppliers(term) {
  term = (term || '').toLowerCase().trim();
  if (!term) { renderSuppliers(allSuppliers); return; }
  const f = allSuppliers.filter(s =>
    (s.name || '').toLowerCase().includes(term) ||
    (s.sap_card_code || '').toLowerCase().includes(term) ||
    (s.tax_id || '').toLowerCase().includes(term)
  );
  renderSuppliers(f);
}

function renderSuppliers(list) {
  const el = $('sup-list');
  if (!list.length) { el.innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
  el.innerHTML = list.slice(0, 300).map(s => {
    const meta = [s.sap_card_code, s.tax_id ? 'RUC ' + s.tax_id : '', s.city].filter(Boolean).join(' · ');
    return '<button class="sup-item" onclick="selectSupplier(\'' + esc(s.sap_card_code).replace(/'/g, "\\'") + '\')">' +
      '<div class="n">' + esc(s.name) + '</div>' +
      '<div class="d">' + esc(meta) + '</div></button>';
  }).join('');
}

function selectSupplier(code) {
  const s = allSuppliers.find(x => x.sap_card_code === code);
  if (!s) return;
  currentSupplier = s;
  $('sup-name').textContent = s.name;
  const meta = [s.sap_card_code, s.tax_id ? 'RUC ' + s.tax_id : ''].filter(Boolean).join(' · ');
  $('sup-meta').textContent = meta;
  $('supplier-modal').classList.add('hidden');
  updateFooter();
}

/* ============ PRODUCTS ============ */
$('prod-search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const term = e.target.value;
  searchTimer = setTimeout(() => searchProducts(term), 280);
});

async function searchProducts(term) {
  term = (term || '').trim();
  const el = $('prod-list');
  if (!term) { el.innerHTML = '<div class="empty">Escribe arriba para buscar productos a reponer.</div>'; return; }
  el.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  const { data, error } = await supa
    .from('products')
    .select('sap_item_code, name, stock, fob_cost, cif_cost, items_per_box, line_jfk, barcode')
    .or('name.ilike.%' + term + '%,sap_item_code.ilike.%' + term + '%,barcode.ilike.%' + term + '%')
    .order('name')
    .limit(60);
  if (error) { el.innerHTML = '<div class="empty">Error: ' + esc(error.message) + '</div>'; return; }
  if (!data || !data.length) { el.innerHTML = '<div class="empty">Sin resultados para “' + esc(term) + '”.</div>'; return; }
  data.forEach(p => { prodCache[p.sap_item_code] = p; });
  renderProducts(data);
}

function renderProducts(list) {
  $('prod-list').innerHTML = list.map(p => {
    const code = p.sap_item_code;
    const q = cart[code] ? cart[code].qty : 0;
    const fob = (p.fob_cost != null) ? money(p.fob_cost) : '—';
    const cif = (p.cif_cost != null) ? money(p.cif_cost) : '—';
    const bulto = (p.items_per_box && p.items_per_box > 1) ? ' · Bulto: ' + p.items_per_box : '';
    return '<div class="prod">' +
      '<div class="pinfo">' +
        '<div class="pcode">' + esc(code) + '</div>' +
        '<div class="pname">' + esc(p.name) + '</div>' +
        '<div class="pmeta">FOB <b>' + fob + '</b> · CIF <b>' + cif + '</b> · Stock: ' + (p.stock ?? 0) + bulto + '</div>' +
      '</div>' +
      '<div class="stepper">' +
        '<button onclick="changeQty(\'' + esc(code).replace(/'/g,"\\'") + '\',-1)">−</button>' +
        '<span class="q" id="q-' + esc(code) + '">' + q + '</span>' +
        '<button onclick="changeQty(\'' + esc(code).replace(/'/g,"\\'") + '\',1)">+</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function changeQty(code, delta) {
  const p = prodCache[code];
  if (!p) return;
  if (!cart[code]) {
    const defPrice = (p.fob_cost != null) ? Number(p.fob_cost) : 0;
    cart[code] = { qty: 0, price: defPrice, product: p };
  }
  cart[code].qty = Math.max(0, cart[code].qty + delta);
  if (cart[code].qty === 0) delete cart[code];
  const qEl = $('q-' + code);
  if (qEl) qEl.textContent = cart[code] ? cart[code].qty : 0;
  updateFooter();
}

/* ============ CART ============ */
function renderCart() {
  const items = cartItems();
  const el = $('cart-list');
  if (!items.length) { el.innerHTML = '<div class="empty">Aún no agregas productos a la reposición.</div>'; return; }
  el.innerHTML = items.map(i => {
    const code = i.product.sap_item_code;
    const lt = i.qty * i.price;
    return '<div class="cart-line">' +
      '<div class="top">' +
        '<div><div class="pcode">' + esc(code) + '</div><div class="pname">' + esc(i.product.name) + '</div></div>' +
        '<button class="rm" onclick="removeLine(\'' + esc(code).replace(/'/g,"\\'") + '\')">Quitar</button>' +
      '</div>' +
      '<div class="row2">' +
        '<div class="cart-field"><label>Cantidad</label>' +
          '<input type="number" min="0" step="1" value="' + i.qty + '" onchange="setQty(\'' + esc(code).replace(/'/g,"\\'") + '\',this.value)"></div>' +
        '<div class="cart-field"><label>Costo unit.</label>' +
          '<input type="number" min="0" step="0.01" value="' + i.price + '" onchange="setPrice(\'' + esc(code).replace(/'/g,"\\'") + '\',this.value)"></div>' +
        '<span class="ltotal">' + money(lt) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function setQty(code, val) {
  if (!cart[code]) return;
  const q = Math.max(0, Math.floor(Number(val) || 0));
  cart[code].qty = q;
  if (q === 0) delete cart[code];
  renderCart(); updateFooter();
}
function setPrice(code, val) {
  if (!cart[code]) return;
  cart[code].price = Math.max(0, Number(val) || 0);
  renderCart(); updateFooter();
}
function removeLine(code) { delete cart[code]; renderCart(); updateFooter(); }

/* ============ FOOTER / TOTALS ============ */
function grandTotal() { return cartItems().reduce((s, i) => s + i.qty * i.price, 0); }
function updateFooter() {
  const items = cartItems();
  const count = items.length;
  $('cart-count').textContent = count;
  $('grand-total').textContent = money(grandTotal());
  const ready = count > 0 && !!currentSupplier;
  $('btn-pdf').disabled = !ready;
  $('btn-xls').disabled = !ready;
  $('btn-sap').disabled = !ready;
}
function renderAll() {
  $('sup-name').textContent = 'Ninguno seleccionado';
  $('sup-meta').textContent = '';
  $('prod-list').innerHTML = '<div class="empty">Escribe arriba para buscar productos a reponer.</div>';
  $('cart-list').innerHTML = '<div class="empty">Aún no agregas productos a la reposición.</div>';
  updateFooter();
}

/* ============ EXPORTS ============ */
function todayStr() { return new Date().toISOString().slice(0, 10); }
function poFileName(ext) {
  const s = (currentSupplier ? currentSupplier.sap_card_code : 'OC');
  return 'OC_' + s + '_' + todayStr() + '.' + ext;
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

$('btn-pdf').addEventListener('click', generatePDF);
$('btn-xls').addEventListener('click', generateExcel);
$('btn-sap').addEventListener('click', enviarSAP);

function generatePDF() {
  const items = cartItems();
  if (!items.length || !currentSupplier) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'letter' });
  const M = 14;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
  doc.text('JFK', M, 18);
  doc.setFontSize(13); doc.text('ORDEN DE COMPRA', 210 - M, 18, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text('JFK International, S.A.', M, 25);
  doc.setTextColor(20); doc.setFontSize(10);
  doc.text('Proveedor: ' + currentSupplier.name, M, 36);
  let y = 41;
  if (currentSupplier.sap_card_code) { doc.text('Código: ' + currentSupplier.sap_card_code, M, y); y += 5; }
  if (currentSupplier.tax_id) { doc.text('RUC: ' + currentSupplier.tax_id, M, y); y += 5; }
  doc.text('Fecha: ' + todayStr(), 210 - M, 36, { align: 'right' });

  const body = items.map(i => [
    i.product.sap_item_code,
    i.product.name || '',
    String(i.qty),
    money(i.price),
    money(i.qty * i.price)
  ]);
  doc.autoTable({
    startY: y + 3,
    head: [['Código', 'Descripción', 'Cant', 'Costo', 'Total']],
    body: body,
    styles: { fontSize: 8.5, cellPadding: 2 },
    headStyles: { fillColor: [14, 16, 22], textColor: 255 },
    columnStyles: { 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } },
    margin: { left: M, right: M }
  });
  const endY = doc.lastAutoTable.finalY || (y + 10);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.text('TOTAL: ' + money(grandTotal()), 210 - M, endY + 9, { align: 'right' });
  doc.save(poFileName('pdf'));
  showToast('PDF generado');
}

async function generateExcel() {
  const items = cartItems();
  if (!items.length || !currentSupplier) return;
  if (typeof ExcelJS === 'undefined') { showToast('Excel no cargó, recarga la página', true); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Orden de Compra');
  ws.columns = [
    { header: 'Código', key: 'code', width: 16 },
    { header: 'Descripción', key: 'name', width: 46 },
    { header: 'Cantidad', key: 'qty', width: 12 },
    { header: 'Costo Unit.', key: 'price', width: 14 },
    { header: 'Total', key: 'total', width: 14 }
  ];
  ws.spliceRows(1, 0, ['ORDEN DE COMPRA — JFK International, S.A.'], ['Proveedor:', currentSupplier.name],
    ['Código:', currentSupplier.sap_card_code || ''], ['RUC:', currentSupplier.tax_id || ''], ['Fecha:', todayStr()], []);
  const headerRow = 7;
  ws.getRow(headerRow).values = ['Código', 'Descripción', 'Cantidad', 'Costo Unit.', 'Total'];
  ws.getRow(headerRow).font = { bold: true };
  items.forEach(i => {
    ws.addRow({ code: i.product.sap_item_code, name: i.product.name, qty: i.qty, price: Number(i.price), total: i.qty * i.price });
  });
  const last = ws.lastRow.number;
  ws.getColumn('price').numFmt = '"$"#,##0.00';
  ws.getColumn('total').numFmt = '"$"#,##0.00';
  ws.addRow({});
  const totRow = ws.addRow({ price: 'TOTAL', total: grandTotal() });
  totRow.getCell('price').font = { bold: true };
  totRow.getCell('total').font = { bold: true };
  totRow.getCell('total').numFmt = '"$"#,##0.00';
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), poFileName('xlsx'));
  showToast('Excel generado');
}

async function enviarSAP() {
  const items = cartItems();
  if (!items.length || !currentSupplier) return;
  const ok = confirm('¿Crear esta Orden de Compra en SAP para "' + currentSupplier.name + '"?\n' +
    items.length + ' productos · Total ' + money(grandTotal()));
  if (!ok) return;

  const btn = $('btn-sap'); const prev = btn.textContent; btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const payload = {
      CardCode: currentSupplier.sap_card_code,
      DocDate: todayStr(),
      Comments: 'Reposición generada desde Portal de Compras JFK',
      DocumentLines: items.map(i => ({ ItemCode: i.product.sap_item_code, Quantity: i.qty, Price: Number(i.price) }))
    };
    const res = await fetch(SAP_PO_ENDPOINT, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (res.ok && data.ok) {
      showToast('✓ Orden de compra creada en SAP — #' + (data.DocNum || data.DocEntry));
      cart = {}; renderCart(); renderAll(); switchTab('cat');
    } else if (res.status === 404) {
      showToast('La función de SAP no está publicada (404). Súbela a Netlify primero.', true);
    } else {
      showToast('SAP: ' + (data.error || ('Error ' + res.status)), true);
    }
  } catch (e) {
    showToast('Error de red: ' + e.message, true);
  } finally {
    btn.textContent = prev; updateFooter();
  }
}

/* ============ INIT ============ */
renderAll();
</script>
</body>
</html>
