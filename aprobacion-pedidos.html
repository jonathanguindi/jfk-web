<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>JFK · Aprobación de pedidos</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){var p=localStorage.getItem('jfk-theme-pref')||'auto';if(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
:root{--ink-900:#0E1016;--ink-800:#1A1D22;--ink-500:#6E7178;--ink-400:#98999B;
--punch:#009FE3;--punch-hover:#0085C0;--electric:#009FE3;--green:#1FA971;--amber:#E8A317;--red:#E5484D;
--font-sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--font-mono:'Space Grotesk',ui-monospace,Menlo,monospace;
--bg:#EEF1F5;--bg-elevated:#FFFFFF;--bg-sunken:#F3F5F8;--text:var(--ink-900);--text-muted:var(--ink-500);--border:#DFE3E9;--border-soft:#EAEDF1;
--cta:var(--punch);--shadow-soft:0 1px 2px rgba(14,16,22,.04),0 8px 24px rgba(14,16,22,.05);--navy:#0B1F3A;}
[data-theme="dark"]{--bg:var(--ink-900);--bg-elevated:var(--ink-800);--bg-sunken:#07080B;--text:#F4F5F7;--text-muted:var(--ink-400);--border:var(--ink-800);--border-soft:#232730;--shadow-soft:0 10px 30px rgba(0,0,0,.4);}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1050px;margin:0 auto;padding:0 16px calc(60px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.topbar .inner{max-width:1050px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:2px}.logo img{height:22px}.logo .reg{color:var(--electric);font-size:9px;font-weight:700;margin-top:1px}
.logo small{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--electric);margin-left:10px}
.spacer{flex:1}.btn{font-weight:700;font-size:.84rem;border:none;border-radius:9px;padding:10px 15px;cursor:pointer}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff}.btn-sm{padding:7px 11px;font-size:.76rem}
.btn-cta{background:var(--cta);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--red);color:#fff}
.btn-outline{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.search{display:flex;gap:8px;margin:18px 0 6px}
.search input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-elevated);color:var(--text);font-size:1rem}
.hint{font-size:.8rem;color:var(--text-muted);margin:2px 2px 12px}
.row{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer}
.row:hover{border-color:var(--cta)}
.row .docn{font-family:var(--font-mono);font-weight:700;color:var(--cta);font-size:.95rem}
.row .cli{font-weight:700}.row .meta{font-size:.78rem;color:var(--text-muted)}
.row .tot{margin-left:auto;text-align:right;font-weight:800;font-size:1.05rem}
.pill{display:inline-block;background:rgba(232,163,23,.15);color:var(--amber);font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.loading{padding:36px;text-align:center;color:var(--text-muted)}
.empty{padding:46px 20px;text-align:center;color:var(--text-muted);background:var(--bg-elevated);border:1px dashed var(--border);border-radius:14px}
/* detalle */
.ov{position:fixed;inset:0;background:rgba(8,10,15,.55);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.sheet{background:var(--bg);border-radius:18px;max-width:780px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.sheet .hd{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.sheet .hd .x{margin-left:auto;background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:9px;font-size:1.1rem;cursor:pointer}
.sheet .bd{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* productos como tarjetas (se ven completos en el cel) */
.plist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pcard{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:12px;padding:11px 13px}
.phead{display:flex;gap:11px;align-items:flex-start}
.pimg{width:54px;height:54px;flex:0 0 auto;object-fit:contain;background:#fff;border:1px solid var(--border-soft);border-radius:9px;cursor:zoom-in}
.pimg.noimg{visibility:hidden}
.pcard .pname{font-weight:800;font-size:.92rem;word-break:break-word}
.pcard .pdesc{font-size:.74rem;color:var(--text-muted);margin-top:1px}
.pstats{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:9px}
.pstats > div{min-width:56px}
.pstats .l{display:block;font-size:.57rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:800}
.pstats b{font-size:.92rem;font-variant-numeric:tabular-nums}
.pstats .m{display:none}
.plist.show-m .pstats .m{display:block}
.kv{display:flex;flex-wrap:wrap;gap:14px 26px;margin-bottom:10px}
.kv div .l{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:800}.kv div .v{font-weight:700}
.tbl-scroll{overflow-x:auto;border:1px solid var(--border-soft);border-radius:12px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.83rem;background:var(--bg-elevated)}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border-soft);white-space:nowrap}th:first-child,td:first-child,.l{text-align:left}
th{font-size:.62rem;text-transform:uppercase;color:var(--text-muted);font-weight:800}
.col-m{display:none}.show-m .col-m{display:table-cell}
tfoot td{font-weight:800;border-top:2px solid var(--border)}
.totline{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tcard{flex:1;min-width:130px;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:12px;padding:11px 13px}
.tcard .l{font-size:.62rem;text-transform:uppercase;color:var(--text-muted);font-weight:800}.tcard .v{font-size:1.15rem;font-weight:800;margin-top:2px}
.tcard.green .v{color:var(--green)} .tcard.blue .v{color:var(--cta)}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.acts .btn{flex:1;min-width:130px;padding:13px;font-size:.95rem}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:.85rem;display:none}
.msg.ok{display:block;background:rgba(31,169,113,.14);color:var(--green)}.msg.err{display:block;background:rgba(229,72,77,.14);color:var(--red)}
.gate{max-width:440px;margin:80px auto;text-align:center;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:16px;padding:34px}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;font-weight:700;font-size:.9rem;padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.logo small{display:none}
.ov{padding:0}
.sheet{max-width:100%;width:100%;height:100%;max-height:100%;border-radius:0}
.sheet .hd{padding-top:calc(14px + env(safe-area-inset-top))}
.acts .btn{min-width:0}}
</style></head>
<body>
<div class="topbar"><div class="inner">
  <div class="logo"><img src="jfk-logo.png" alt="JFK"><sup class="reg">&reg;</sup><small>Aprobación de pedidos</small></div>
  <span class="spacer"></span>
  <button class="btn btn-ghost btn-sm" onclick="toggleTheme()">◐</button>
  <button class="btn btn-ghost btn-sm" onclick="location.href='vendedores.html'">← Portal</button>
  <button class="btn btn-ghost btn-sm" onclick="cargar()">🔄</button>
</div></div>

<div id="app" class="wrap" style="display:none">
  <div class="search">
    <input id="q" type="number" inputmode="numeric" placeholder="Buscar # de pedido…" onkeydown="if(event.key==='Enter')buscar()">
    <button class="btn btn-cta" onclick="buscar()">Buscar</button>
  </div>
  <div class="hint">Pedidos <b>no autorizados</b> (esperando tu aprobación). Ábrelos para ver el margen y autorizar/cancelar.</div>
  <div id="lista"><div class="loading">Cargando pedidos…</div></div>
</div>

<div id="ov" class="ov" onclick="if(event.target===this)cerrar()">
  <div class="sheet">
    <div class="hd"><span id="ovTitle" style="font-weight:800">Pedido</span><button class="x" onclick="cerrar()">✕</button></div>
    <div class="bd" id="ovBody"><div class="loading">Cargando…</div></div>
  </div>
</div>

<div id="lightbox" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;align-items:center;justify-content:center;padding:20px;cursor:zoom-out"><img id="lightbox-img" style="max-width:95%;max-height:90%;object-fit:contain;background:#fff;border-radius:12px"></div>

<div id="gate" class="gate" style="display:none"><h2 style="margin-top:0">Acceso restringido</h2><p style="color:var(--text-muted)">Inicia sesión en el portal de vendedores como administrador.</p><a class="btn btn-sm btn-cta" href="vendedores.html">Ir al portal →</a></div>

<script>
const SESSION_KEY='jfk_vendor_session';
const SUPABASE_URL='https://gpighopguwafnxouejfb.supabase.co';
const THUMB_IMG_BASE=`${SUPABASE_URL}/storage/v1/object/public/productos-thumb`;
const PRODUCT_IMG_BASE=`${SUPABASE_URL}/storage/v1/object/public/productos`;
let sesion=null;try{sesion=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){}
const EMAIL=(sesion&&sesion.email||'').trim().toLowerCase();
const ES_ADMIN=!!(sesion&&sesion.role==='admin');
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',c);localStorage.setItem('jfk-theme-pref',c);}
const fmt=(n)=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=(s)=>(''+(s==null?'':s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
let _abierto=null;

if(!sesion){document.getElementById('gate').style.display='block';}
else{document.getElementById('app').style.display='block';cargar();}

async function api(accion,extra){
  const r=await fetch('/.netlify/functions/pedidos-aprobacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL,accion,...(extra||{})})});
  return r.json();
}
async function cargar(){
  document.getElementById('lista').innerHTML='<div class="loading">Cargando pedidos…</div>';
  const d=await api('listar');
  if(!d.ok){document.getElementById('lista').innerHTML='<div class="empty">'+esc(d.error||'Error')+'</div>';return;}
  render(d.pedidos||[]);
}
function render(peds){
  if(!peds.length){document.getElementById('lista').innerHTML='<div class="empty">🎉 No hay pedidos pendientes por aprobar.</div>';return;}
  document.getElementById('lista').innerHTML=peds.map(p=>`<div class="row" onclick="abrir(${p.doc_entry})">
    <div><div class="docn">#${esc(p.doc_num)}</div><span class="pill">por aprobar</span></div>
    <div style="min-width:0"><div class="cli">${esc(p.cliente)}</div><div class="meta">${esc(p.fecha)}${p.vendedor?' · 👤 '+esc(p.vendedor):''}</div></div>
    <div class="tot num">${fmt(p.total)}</div>
  </div>`).join('');
}
async function buscar(){
  const n=document.getElementById('q').value.trim();
  if(!n){cargar();return;}
  const d=await api('detalle',{doc_num:Number(n)});
  if(!d.ok){document.getElementById('lista').innerHTML='<div class="empty">'+esc(d.error||'No encontrado')+'</div>';return;}
  mostrarDetalle(d.pedido);
}
async function abrir(de){
  document.getElementById('ov').classList.add('show');
  document.getElementById('ovBody').innerHTML='<div class="loading">Cargando…</div>';
  const d=await api('detalle',{doc_entry:de});
  if(!d.ok){document.getElementById('ovBody').innerHTML='<div class="empty">'+esc(d.error||'Error')+'</div>';return;}
  mostrarDetalle(d.pedido);
}
function cerrar(){document.getElementById('ov').classList.remove('show');_abierto=null;}
function openLightbox(url){const lb=document.getElementById('lightbox');document.getElementById('lightbox-img').src=url;lb.style.display='flex';}
let _toastT=null;
function toast(txt){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=txt;t.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function mostrarDetalle(p){
  _abierto=p;
  document.getElementById('ov').classList.add('show');
  document.getElementById('ovTitle').textContent='Pedido #'+p.doc_num;
  const estadoTxt=p.cancelado?'<span class="pill" style="background:rgba(229,72,77,.15);color:var(--red)">cancelado</span>':(p.autorizado?'<span class="pill" style="background:rgba(31,169,113,.15);color:var(--green)">autorizado</span>':'<span class="pill">por aprobar</span>');
  const filas=p.lineas.map(l=>`<div class="pcard">
    <div class="phead">
      <img class="pimg" width="54" height="54" loading="lazy" decoding="async" src="${THUMB_IMG_BASE}/${encodeURIComponent(l.item)}.jpg" onclick="openLightbox('${PRODUCT_IMG_BASE}/${encodeURIComponent(l.item)}.jpg')" onerror="this.classList.add('noimg');this.removeAttribute('onclick')">
      <div style="min-width:0"><div class="pname">${esc(l.item)}</div><div class="pdesc">${esc(l.desc||'')}</div></div>
    </div>
    <div class="pstats">
      <div><span class="l">Cant.</span><b>${l.qty}</b></div>
      <div><span class="l">P. venta</span><b>${fmt(l.precio_venta)}</b></div>
      <div><span class="l">Venta</span><b>${fmt(l.venta)}</b></div>
      <div class="m"><span class="l">Costo u.</span><b>${fmt(l.costo_unit)}</b></div>
      <div class="m"><span class="l">Ganancia</span><b style="color:var(--green)">${fmt(l.ganancia)}</b></div>
      <div class="m"><span class="l">Margen</span><b style="color:${l.margen_pct>=30?'var(--green)':l.margen_pct>=15?'var(--amber)':'var(--red)'}">${l.margen_pct}%</b></div>
    </div>
  </div>`).join('');
  document.getElementById('ovBody').innerHTML=`
    <div class="kv">
      <div><div class="l">Cliente</div><div class="v">${esc(p.cliente)}</div></div>
      <div><div class="l">Vendedor</div><div class="v">${p.vendedor?'👤 '+esc(p.vendedor):'—'}</div></div>
      <div><div class="l">Fecha</div><div class="v">${esc(p.fecha)}</div></div>
      <div><div class="l">Total</div><div class="v num">${fmt(p.total)}</div></div>
      <div><div class="l">Estado</div><div class="v">${estadoTxt}</div></div>
    </div>
    <button class="btn btn-outline btn-sm" id="btnMargen" onclick="toggleMargen()">🙈 Ocultar margen</button>
    <div id="tblWrap" class="plist show-m">${filas}</div>
    <div class="totline" id="totMargen" style="display:flex">
      <div class="tcard blue"><div class="l">Venta total</div><div class="v num">${fmt(p.venta_total)}</div></div>
      <div class="tcard"><div class="l">Costo total</div><div class="v num">${fmt(p.costo_total)}</div></div>
      <div class="tcard green"><div class="l">Ganancia</div><div class="v num">${fmt(p.ganancia_total)}</div></div>
      <div class="tcard"><div class="l">Margen final</div><div class="v num" style="color:${p.margen_final>=30?'var(--green)':p.margen_final>=15?'var(--amber)':'var(--red)'}">${p.margen_final}%</div></div>
    </div>
    <div class="msg" id="msg"></div>
    ${p.autorizado||p.cancelado?'<div class="hint" style="margin-top:14px">Este pedido ya está '+(p.cancelado?'cancelado':'autorizado')+'.</div>':`
    <div class="acts">
      <button class="btn btn-green" id="btnAuth" onclick="autorizar()">✓ Autorizar pedido</button>
      <button class="btn btn-red" id="btnCanc" onclick="cancelar()">✕ Cancelar pedido</button>
    </div>${ES_ADMIN?'':'<div class="hint" style="margin-top:8px;color:var(--red)">Solo el administrador puede autorizar/cancelar.</div>'}`}
  `;
}
function toggleMargen(){
  const w=document.getElementById('tblWrap');const t=document.getElementById('totMargen');const b=document.getElementById('btnMargen');
  const on=w.classList.toggle('show-m');t.style.display=on?'flex':'none';b.textContent=on?'🙈 Ocultar margen':'💰 Ver margen / ganancia';
}
function setMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
async function autorizar(){
  if(!_abierto)return;
  if(!confirm('¿Autorizar el pedido #'+_abierto.doc_num+'? Después de autorizarlo, bodega lo puede trabajar.'))return;
  const b=document.getElementById('btnAuth');b.disabled=true;b.textContent='Autorizando…';
  const num=_abierto.doc_num;
  const d=await api('autorizar',{doc_entry:_abierto.doc_entry});
  if(d.ok){setMsg('✓ Pedido autorizado en SAP. Ya lo pueden trabajar en bodega.',true);document.querySelector('.acts').style.display='none';toast('✓ Pedido #'+num+' autorizado');setTimeout(()=>{cerrar();cargar();},700);}
  else{setMsg('No se pudo autorizar: '+(d.error||'error'),false);b.disabled=false;b.textContent='✓ Autorizar pedido';}
}
async function cancelar(){
  if(!_abierto)return;
  if(!confirm('¿CANCELAR el pedido #'+_abierto.doc_num+' en SAP? Esto no se puede deshacer.'))return;
  const b=document.getElementById('btnCanc');b.disabled=true;b.textContent='Cancelando…';
  const num=_abierto.doc_num;
  const d=await api('cancelar',{doc_entry:_abierto.doc_entry});
  if(d.ok){setMsg('Pedido cancelado en SAP.',true);document.querySelector('.acts').style.display='none';toast('Pedido #'+num+' cancelado');setTimeout(()=>{cerrar();cargar();},700);}
  else{setMsg('No se pudo cancelar: '+(d.error||'error'),false);b.disabled=false;b.textContent='✕ Cancelar pedido';}
}
</script>
</body></html>
