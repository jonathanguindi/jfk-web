<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Contabilidad JFK · Correos de cobranza</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){var p=localStorage.getItem('jfk-theme-pref')||'auto';if(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();</script>
<style>
:root{--ink-900:#0E1016;--ink-800:#1A1D22;--ink-500:#6E7178;--ink-400:#98999B;
--punch:#009FE3;--punch-hover:#0085C0;--electric:#009FE3;--green:#1FA971;--amber:#E8A317;--red:#E5484D;
--font-sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--font-mono:'Space Grotesk',ui-monospace,Menlo,monospace;
--bg:#EEF1F5;--bg-elevated:#FFFFFF;--bg-sunken:#F3F5F8;--text:var(--ink-900);--text-muted:var(--ink-500);--border:#DFE3E9;--border-soft:#EAEDF1;
--cta:var(--punch);--shadow-soft:0 1px 2px rgba(14,16,22,.04),0 8px 24px rgba(14,16,22,.05);--navy:#0B1F3A;}
[data-theme="dark"]{--bg:var(--ink-900);--bg-elevated:var(--ink-800);--bg-sunken:#07080B;--text:#F4F5F7;--text-muted:var(--ink-400);--border:var(--ink-800);--border-soft:#232730;--shadow-soft:0 10px 30px rgba(0,0,0,.4);}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1150px;margin:0 auto;padding:0 16px calc(60px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.topbar .inner{max-width:1150px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:2px}.logo img{height:22px}.logo .reg{color:var(--electric);font-size:9px;font-weight:700;margin-top:1px}
.logo small{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--electric);margin-left:10px}
.spacer{flex:1}.btn{font-weight:600;font-size:.82rem;border:none;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff}.btn-sm{padding:6px 10px;font-size:.74rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 8px}
.kpi{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:14px;padding:14px;box-shadow:var(--shadow-soft)}
.kpi .lbl{font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);font-weight:800}.kpi .val{font-size:1.4rem;font-weight:800;margin-top:4px}
.kpi.green .val{color:var(--green)}.kpi.red .val{color:var(--red)}.kpi.amber .val{color:var(--amber)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.fbtn{background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.78rem;cursor:pointer;color:var(--text)}
.fbtn.active{background:var(--cta);color:#fff;border-color:var(--cta)}
.card{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:14px;box-shadow:var(--shadow-soft);overflow:hidden;margin-top:8px}
.tbl-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border-soft);white-space:nowrap}th:first-child,td:first-child,.l{text-align:left}
th{font-size:.64rem;text-transform:uppercase;color:var(--text-muted);font-weight:800;position:sticky;top:0;background:var(--bg-elevated)}
tbody tr:hover{background:var(--bg-sunken)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:800}
.b-env{background:rgba(31,169,113,.15);color:var(--green)} .b-err{background:rgba(229,72,77,.15);color:var(--red)} .b-pen{background:rgba(232,163,23,.15);color:var(--amber)} .b-des{background:var(--bg-sunken);color:var(--text-muted)}
.chip{font-size:.7rem;font-weight:700;color:var(--text-muted)}
.loading{padding:40px;text-align:center;color:var(--text-muted)}
.gate{max-width:440px;margin:80px auto;text-align:center;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:16px;padding:34px}
@media(max-width:600px){.logo small{display:none}}
</style></head>
<body>
<div class="topbar"><div class="inner">
  <div class="logo"><img src="jfk-logo.png" alt="JFK"><sup class="reg">&reg;</sup><small>Correos de cobranza</small></div>
  <span class="spacer"></span>
  <button class="btn btn-ghost btn-sm" onclick="toggleTheme()">◐</button>
  <button class="btn btn-ghost btn-sm" onclick="location.href='estado.html'">🧮 Contabilidad</button>
  <button class="btn btn-ghost btn-sm" onclick="cargar()">🔄</button>
</div></div>
<div id="app" class="wrap" style="display:none">
  <p style="font-size:.82rem;color:var(--text-muted);margin:14px 2px 0">A quién se le envió su estado de cuenta automáticamente. Los recurrentes salen solos cada día/semana según su cadencia.</p>
  <div id="kpis" class="kpis"></div>
  <div class="filters" id="filters">
    <button class="fbtn active" data-f="hoy">Hoy</button>
    <button class="fbtn" data-f="7d">7 días</button>
    <button class="fbtn" data-f="mes">30 días</button>
    <button class="fbtn" data-f="todos">Todos</button>
    <span class="spacer"></span>
    <button class="btn btn-sm" style="background:var(--bg-elevated);border:1px solid var(--border);color:var(--text)" onclick="exportarCSV()">⬇️ CSV</button>
  </div>
  <div class="card"><div class="tbl-scroll"><table>
    <thead><tr><th class="l">Cliente</th><th class="l">Correo</th><th>Vencido</th><th>Atraso</th><th>Cadencia</th><th>Estado</th><th>Fecha</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="7" class="loading">Cargando…</td></tr></tbody>
  </table></div></div>
</div>
<div id="gate" class="gate" style="display:none"><h2 style="margin-top:0">Acceso restringido</h2><p style="color:var(--text-muted)">Entra primero a Contabilidad JFK.</p><a class="btn btn-sm" style="background:var(--cta);color:#fff" href="estado.html">Ir a Contabilidad JFK →</a></div>
<script>
const SESSION_KEY='jfk_vendor_session';
let sesion=null;try{sesion=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',c);localStorage.setItem('jfk-theme-pref',c);}
const EMAIL=(sesion&&sesion.email||'').trim().toLowerCase();
const ES_ADMIN=!!(sesion&&sesion.role==='admin');
const fmt=(n)=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=(s)=>(''+(s==null?'':s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
let _filtro='hoy',_rows=[];
if(!ES_ADMIN){document.getElementById('gate').style.display='block';}
else{document.getElementById('app').style.display='block';
  document.querySelectorAll('#filters .fbtn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#filters .fbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');_filtro=b.dataset.f;cargar();}));
  cargar();}
const BADGE={enviado:'b-env',error:'b-err',pendiente:'b-pen',descartado:'b-des'};
const BTXT={enviado:'✓ Enviado',error:'✗ Error',pendiente:'⏳ Pendiente',descartado:'– Descartado'};
async function cargar(){
  document.getElementById('tbody').innerHTML='<tr><td colspan="7" class="loading">Cargando…</td></tr>';
  try{
    const r=await fetch('/.netlify/functions/cobranzas-lista',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL,filtro:_filtro})});
    const d=await r.json();
    if(!d.ok){document.getElementById('tbody').innerHTML='<tr><td colspan="7" class="loading">'+esc(d.error||'error')+'</td></tr>';return;}
    _rows=d.envios||[];const s=d.resumen;
    document.getElementById('kpis').innerHTML=`
      <div class="kpi green"><div class="lbl">Enviados (${_filtro==='hoy'?'hoy':_filtro})</div><div class="val num">${s.enviados}</div></div>
      <div class="kpi"><div class="lbl">Monto vencido cobrado</div><div class="val num">${fmt(s.monto_vencido)}</div></div>
      <div class="kpi ${s.errores?'red':''}"><div class="lbl">Con error</div><div class="val num">${s.errores}</div></div>
      <div class="kpi ${s.pendientes?'amber':''}"><div class="lbl">Pendientes</div><div class="val num">${s.pendientes}</div></div>`;
    if(!_rows.length){document.getElementById('tbody').innerHTML='<tr><td colspan="7" class="loading">No hay envíos en este periodo. Los recurrentes salen automáticamente a las 8 AM.</td></tr>';return;}
    document.getElementById('tbody').innerHTML=_rows.map(r=>`<tr>
      <td class="l"><b>${esc(r.cliente)}</b> <span class="chip">${esc(r.codigo||'')}</span></td>
      <td class="l">${r.correo?esc(r.correo):'<span class="chip" style="color:var(--red)">sin correo</span>'}</td>
      <td class="num">${fmt(r.vencido)}</td>
      <td class="num">${r.atraso!=null?r.atraso+'d':'—'}</td>
      <td>${esc(r.cadencia)}</td>
      <td><span class="badge ${BADGE[r.status]||'b-des'}">${BTXT[r.status]||esc(r.status)}</span>${r.error?`<div class="chip" style="color:var(--red)">${esc(r.error)}</div>`:''}</td>
      <td class="num">${esc(r.fecha||'—')}</td>
    </tr>`).join('');
  }catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan="7" class="loading">Error de conexión.</td></tr>';}
}
function exportarCSV(){
  const head=['Cliente','Codigo','Correo','Vencido','AtrasoDias','Cadencia','Estado','Fecha','Error'];
  const lines=[head.join(',')].concat(_rows.map(r=>[r.cliente,r.codigo,r.correo,r.vencido,r.atraso,r.cadencia,r.status,r.fecha,r.error].map(x=>'"'+(''+(x==null?'':x)).replace(/"/g,'""')+'"').join(',')));
  const b=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='correos-cobranza-'+_filtro+'.csv';a.click();
}
</script>
</body></html>
