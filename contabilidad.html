<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>JFK · Contabilidad</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#0B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  (function(){ var pref = localStorage.getItem('jfk-theme-pref') || 'auto';
    if (pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.setAttribute('data-theme','dark'); })();
</script>
<style>
:root{
  --ink-900:#0E1016; --ink-800:#1A1D22; --ink-700:#34363B; --ink-600:#54565B;
  --ink-500:#6E7178; --ink-400:#98999B; --ink-300:#C4C6CA; --ink-200:#D4D6DA;
  --ink-100:#E5E7EA; --ink-50:#F4F5F7;
  --punch:#009FE3; --punch-hover:#0085C0; --electric:#009FE3;
  --green:#1FA971; --amber:#E8A317; --red:#E5484D;
  --font-sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'Space Grotesk',ui-monospace,'SF Mono',Menlo,'Courier New',monospace;
  --bg:#EEF1F5; --bg-elevated:#FFFFFF; --bg-sunken:#F3F5F8;
  --text:var(--ink-900); --text-muted:var(--ink-500); --text-subtle:var(--ink-400);
  --border:#DFE3E9; --border-soft:#EAEDF1;
  --accent:var(--electric); --cta:var(--punch); --cta-hover:var(--punch-hover);
  --shadow-soft:0 1px 2px rgba(14,16,22,0.04), 0 8px 24px rgba(14,16,22,0.05);
  --navy:#0B1F3A;
}
[data-theme="dark"]{
  --bg:var(--ink-900); --bg-elevated:var(--ink-800); --bg-sunken:#07080B;
  --text:#F4F5F7; --text-muted:var(--ink-400); --text-subtle:var(--ink-500);
  --border:var(--ink-700); --border-soft:var(--ink-800);
  --shadow-soft:0 10px 30px rgba(0,0,0,0.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px calc(80px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.07);padding-top:env(safe-area-inset-top)}
.topbar .inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:2px}
.logo .logobox{display:inline-flex;align-items:flex-start}
.logo img{height:24px;width:auto;display:block}
.logo .reg{color:var(--electric);font-size:9px;font-weight:700;line-height:1;margin:1px 0 0 1px}
.logo small{font-family:var(--font-mono);font-size:.62rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--electric);display:block;margin-left:10px}
.spacer{flex:1}
.btn{font-family:var(--font-sans);font-weight:600;font-size:.82rem;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff} .btn-ghost:hover{background:rgba(255,255,255,.18)}
.btn-sm{padding:6px 10px;font-size:.74rem}
.topnav{display:flex;gap:6px;flex-wrap:wrap}
.navcur{background:var(--cta) !important}
#whoAmI{font-size:.8rem;color:#cdd6e0;font-weight:600}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 6px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.8rem;cursor:pointer;color:var(--text)}
.preset.active{background:var(--cta);color:#fff;border-color:var(--cta)}
.muted{color:var(--text-muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:14px;padding:16px;box-shadow:var(--shadow-soft)}
.kpi .lbl{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:800}
.kpi .val{font-size:1.5rem;font-weight:800;margin-top:6px;letter-spacing:-.02em;line-height:1.05}
.kpi .sub{font-size:.72rem;color:var(--text-muted);margin-top:3px}
.kpi.accent{background:linear-gradient(135deg,var(--cta),#0072b8);color:#fff;border:none}
.kpi.accent .lbl,.kpi.accent .sub{color:rgba(255,255,255,.85)}
.kpi.good .val{color:var(--green)} .kpi.warn .val{color:var(--amber)}

.card{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:14px;padding:18px;margin-top:18px;box-shadow:var(--shadow-soft)}
.card h2{font-size:1rem;margin:0 0 4px;font-weight:800}
.card .h-sub{font-size:.76rem;color:var(--text-muted);margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:4px 0 12px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 10px;font-weight:700;font-size:.82rem;color:var(--text-muted);cursor:pointer;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--cta)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--border-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:800}
tbody tr:hover{background:var(--bg-sunken)}
.pos{color:var(--green);font-weight:700} .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700}
.bars{display:flex;align-items:stretch;gap:6px;height:150px;margin-top:8px}
.bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;height:100%}
.bar{width:100%;max-width:38px;min-height:3px;background:var(--cta);border-radius:5px 5px 0 0;transition:.2s}
.bar-lbl{font-size:.6rem;color:var(--text-muted);white-space:nowrap}
.gate{max-width:460px;margin:90px auto;text-align:center;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:16px;padding:34px;box-shadow:var(--shadow-soft)}
.loading{padding:40px;text-align:center;color:var(--text-muted)}
.soon{background:var(--bg-sunken);border:1px dashed var(--border);border-radius:12px;padding:18px;color:var(--text-muted);font-size:.86rem}
@media(max-width:560px){ .kpi .val{font-size:1.3rem} .logo small{display:none} }
</style>
</head>
<body>
<div class="topbar"><div class="inner">
  <div class="logo"><span class="logobox"><img src="jfk-logo.png" alt="JFK"><sup class="reg">&reg;</sup></span><small>Contabilidad</small></div>
  <span id="whoAmI"></span>
  <div class="spacer"></div>
  <button class="btn btn-ghost btn-sm" onclick="toggleTheme()">◐</button>
  <nav class="topnav">
    <button class="btn btn-ghost btn-sm" onclick="location.href='vendedores.html'">🏠 Inicio</button>
    <button class="btn btn-ghost btn-sm" onclick="location.href='dashboard.html'">📊 Ventas</button>
    <button class="btn btn-ghost btn-sm navcur">🧮 Contabilidad</button>
  </nav>
</div></div>

<div id="app" class="wrap" style="display:none">
  <div class="filters">
    <div class="presets" id="presets">
      <button class="preset" data-p="mes">Este mes</button>
      <button class="preset" data-p="mes_pasado">Mes pasado</button>
      <button class="preset active" data-p="ano">Este año</button>
    </div>
    <span class="spacer"></span>
    <span class="muted num" id="rangeLbl" style="font-size:.78rem"></span>
  </div>

  <div id="content"><div class="loading">Cargando…</div></div>
</div>

<div id="gate" class="gate" style="display:none">
  <h2 style="margin-top:0">Acceso restringido</h2>
  <p class="muted">El panel de contabilidad es solo para el administrador.</p>
  <a class="btn btn-sm" style="background:var(--cta);color:#fff" href="vendedores.html">Ir al portal →</a>
</div>

<script>
const SESSION_KEY='jfk_vendor_session';
let sesion=null; try{ sesion=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){}
function toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',cur==='dark'?'dark':'light'); localStorage.setItem('jfk-theme-pref',cur); }
const fmt=(n)=>'$'+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmt2=(n)=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n)=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:1})+'%';
const esc=(s)=>(''+(s==null?'':s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const margenPct=(t,c)=>{ t=Number(t)||0; c=Number(c)||0; return t>0?Math.round((t-c)/t*1000)/10:0; };

const EMAIL=(sesion&&sesion.email||'').trim().toLowerCase();
const ES_ADMIN=!!(sesion && sesion.role==='admin');
if(!sesion || !sesion.email || !ES_ADMIN){
  document.getElementById('gate').style.display='block';
}else{
  document.getElementById('app').style.display='block';
  document.getElementById('whoAmI').textContent=EMAIL;
  initPresets();
  cargar('ano');
}

function initPresets(){
  document.querySelectorAll('#presets .preset').forEach(b=>{
    b.addEventListener('click',()=>{ document.querySelectorAll('#presets .preset').forEach(x=>x.classList.remove('active')); b.classList.add('active'); cargar(b.dataset.p); });
  });
}

let _data=null, _tab='por_familia';
async function cargar(periodo){
  document.getElementById('content').innerHTML='<div class="loading">Cargando contabilidad…</div>';
  try{
    const r=await fetch('/.netlify/functions/contabilidad-resumen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:EMAIL,periodo})});
    const d=await r.json();
    if(!d.ok){ document.getElementById('content').innerHTML='<div class="card">No se pudo cargar: '+esc(d.error||'error')+'</div>'; return; }
    _data=d; render();
  }catch(e){ document.getElementById('content').innerHTML='<div class="card">Error de conexión.</div>'; }
}

function render(){
  const d=_data, k=(d.pnl&&d.pnl.kpis)||{}, ar=d.cuentas_por_cobrar||{};
  document.getElementById('rangeLbl').textContent=d.desde+'  →  '+d.hasta;
  const util=Number(k.margen_total)||0, ventas=Number(k.ventas_total)||0, costo=Number(k.costo_total)||0;
  const margen=Number(k.margen_pct)||0;

  // KPIs
  const kpis=`<div class="kpis">
    <div class="kpi accent"><div class="lbl">Ventas (sin imp.)</div><div class="val num">${fmt(ventas)}</div><div class="sub num">${k.num_facturas||0} facturas</div></div>
    <div class="kpi"><div class="lbl">Costo de ventas</div><div class="val num">${fmt(costo)}</div><div class="sub">cobertura costo ${k.costo_cob||0}%</div></div>
    <div class="kpi good"><div class="lbl">Utilidad bruta</div><div class="val num">${fmt(util)}</div><div class="sub">ganancia del periodo</div></div>
    <div class="kpi ${margen>=30?'good':'warn'}"><div class="lbl">Margen bruto</div><div class="val num">${pct(margen)}</div><div class="sub">utilidad / ventas</div></div>
    <div class="kpi"><div class="lbl">Ticket promedio</div><div class="val num">${fmt(k.ticket_promedio)}</div><div class="sub">por factura</div></div>
    <div class="kpi"><div class="lbl">Clientes activos</div><div class="val num">${k.num_clientes||0}</div><div class="sub">${k.num_paises||0} países</div></div>
  </div>`;

  // Tendencia mensual
  const tend=(d.pnl.tendencia||[]);
  const maxT=Math.max(1,...tend.map(t=>Number(t.total)||0));
  const bars=tend.length?`<div class="card"><h2>Ventas por mes</h2><div class="h-sub">Tendencia del periodo</div>
    <div class="bars">${tend.map(t=>{const h=Math.round((Number(t.total)||0)/maxT*100);return `<div class="bar-wrap" title="${esc(t.mes)}: ${fmt(t.total)}"><div class="bar" style="height:${h}%"></div><div class="bar-lbl">${esc((t.mes||'').slice(5))}</div></div>`;}).join('')}</div></div>`:'';

  // Cuentas por cobrar
  const arTop=(ar.top||[]).map((c,i)=>`<tr><td>${i+1}. ${esc(c.name)}</td><td class="muted">${esc(c.city||'')}</td><td class="num">${fmt2(c.saldo)}</td></tr>`).join('');
  const arCard=`<div class="card"><h2>Cuentas por cobrar</h2><div class="h-sub">Saldo de clientes (snapshot diario de SAP)</div>
    <div class="kpis" style="margin-top:0">
      <div class="kpi warn"><div class="lbl">Total por cobrar</div><div class="val num">${fmt(ar.total)}</div><div class="sub">${ar.num_deudores||0} clientes con saldo</div></div>
    </div>
    <table style="margin-top:14px"><thead><tr><th>Cliente</th><th>Ciudad</th><th>Saldo</th></tr></thead><tbody>${arTop||'<tr><td colspan="3" class="muted">Sin saldos pendientes</td></tr>'}</tbody></table>
  </div>`;

  // Desglose por dimensión (con costo/utilidad/margen — admin)
  const dims=[['por_familia','Categoría','name'],['por_cliente','Cliente','name'],['por_producto','Producto','descripcion'],['por_pais','País','name']];
  const tabsBtns=dims.map(([key,lbl])=>`<button class="tab ${_tab===key?'active':''}" onclick="setTab('${key}')">${lbl}</button>`).join('');
  const rows=(d.pnl[_tab]||[]).slice(0,40).map((r,i)=>{
    const t=Number(r.total)||0, c=Number(r.costo)||0, u=t-c, mp=margenPct(t,c);
    const nameField=_tab==='por_producto'?(r.descripcion||r.code):(r.name||r.code||'');
    return `<tr><td>${i+1}. ${esc(nameField)}</td><td class="num">${fmt(t)}</td><td class="num muted">${fmt(c)}</td><td class="num pos">${fmt(u)}</td><td class="num">${pct(mp)}</td></tr>`;
  }).join('');
  const desglose=`<div class="card"><h2>Rentabilidad</h2><div class="h-sub">Ventas, costo, utilidad y margen — por dimensión</div>
    <div class="tabs">${tabsBtns}</div>
    <table><thead><tr><th id="dimcol">Detalle</th><th>Ventas</th><th>Costo</th><th>Utilidad</th><th>Margen</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">Sin datos</td></tr>'}</tbody></table>
  </div>`;

  // Cuentas por pagar (placeholder hasta sincronizar SAP)
  const ap=`<div class="card"><h2>Cuentas por pagar</h2><div class="h-sub">Lo que JFK debe a proveedores</div>
    <div class="soon">🔧 <b>Próximo paso:</b> sincronizar las facturas de proveedores de SAP para mostrar aquí lo que se debe, vencimientos y pagos. (Es solo lectura, no necesita permisos especiales.)</div></div>`;

  document.getElementById('content').innerHTML=kpis+bars+desglose+arCard+ap;
}
function setTab(k){ _tab=k; render(); }
</script>
</body>
</html>
