# netlify.toml — JFK portal
# Sitio estático (raíz) + Netlify Functions en netlify/functions.

[build]
  publish = "."
  # Netlify instala las dependencias de package.json automáticamente (resend, pdfkit, supabase).
  # No hay paso de build del sitio (es estático).

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # pdfkit incluye archivos de fuentes (.afm) que el bundler no rastrea; lo incluimos completo.
  external_node_modules = ["pdfkit"]

# Job diario de cobranzas. Cron en UTC: 13:00 UTC = 8:00 AM Panamá (UTC-5).
[functions."cobranzas-job"]
  schedule = "0 13 * * *"

# Sincronización nocturna de ventas SAP -> Supabase (dashboard).
# 06:00 UTC = 1:00 AM Panamá. Reanudable: se completa en varias corridas si hace falta.
[functions."ventas-sync"]
  schedule = "0 6 * * *"

# Sincronización diaria de clientes SAP -> tabla customers (correos, saldo, datos).
# 05:00 UTC = 12:00 AM Panamá. Actualiza/agrega todos los clientes.
[functions."customers-sync-background"]
  schedule = "0 5 * * *"

# Sincronización diaria de inventario (stock) SAP -> tabla products.
# 04:00 UTC = 11:00 PM Panamá.
[functions."products-sync-background"]
  schedule = "0 4 * * *"

# Chequeo diario de salud (sync, dashboard, dormidos, reportes, CRM, correo).
# 12:00 UTC = 7:00 AM Panamá. Manda email de estado al admin (alerta si algo falla).
[functions."salud-diaria"]
  schedule = "0 12 * * *"

# Agenda del día: manda a cada vendedor su lista de visitas de hoy por correo.
# 11:30 UTC = 6:30 AM Panamá (antes de arrancar el día).
[functions."agenda-diaria"]
  schedule = "30 11 * * *"

# Sincronización diaria de gastos (facturas de servicio) SAP -> gastos_sap (dashboard de gastos).
# 07:00 UTC = 2:00 AM Panamá.
[functions."gastos-sync-background"]
  schedule = "0 7 * * *"
